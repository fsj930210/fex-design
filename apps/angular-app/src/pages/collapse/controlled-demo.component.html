<fex-card
  title="Controlled"
  description="expandedKeys and change let external state own the panels."
>
  <div class="mb-2 flex flex-wrap gap-1.5">
    <button button variant="outline" size="sm" (click)="expandedKeys.set(['profile'])">
      Open profile
    </button>
    <button button variant="outline" size="sm" (click)="expandedKeys.set(['billing', 'security'])">
      Open billing and security
    </button>
    <button button variant="ghost" size="sm" (click)="expandedKeys.set([])">Clear</button>
  </div>
  <div fexCollapse [expandedKeys]="expandedKeys()" (change)="expandedKeys.set($event.keys)">
    @for (item of items; track item.value) {
      <div [fexCollapseItem]="item.value">
        <button fexCollapseTrigger>
          <span class="min-w-0 flex-1">{{ item.title }}</span>
          <fex-chevron-right-icon
            class="size-4 shrink-0 text-muted-foreground transition-transform duration-200 group-data-[state=open]/collapse-trigger:-rotate-90"
          />
        </button>
        <div fexCollapseContent>{{ item.content }}</div>
      </div>
    }
  </div>
</fex-card>
