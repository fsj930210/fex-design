<div
  popoverRoot
  [open]="context().open"
  [trigger]="[]"
  placement="bottom"
  align="center"
  (openChange)="setOpen($event)"
>
  <ng-content select="fex-date-picker-trigger" />
  <ng-template popoverPortal
    ><div popoverContent [class]="contentClassName()">
      <ng-content select="fex-date-picker-content" /></div
  ></ng-template>
</div>
