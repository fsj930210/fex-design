<div class="flex w-full min-w-0 flex-col gap-4">
  @for (item of formats; track item.format) {
    <section class="flex w-full min-w-0 flex-col gap-2">
      <p class="text-sm text-muted-foreground">{{ item.format }} — {{ item.label }}</p>
      <div timePickerRoot [format]="item.format" [use12Hours]="item.use12Hours" [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
        <div timePickerTrigger></div>
        <ng-template popoverPortal><div timePickerContent><div timePickerPanel>
          @for (column of item.columns; track column.unit) {
            @switch (column.unit) {
              @case ('hour') { <div timePickerHourColumn [step]="item.stepped ? 2 : 1"></div> }
              @case ('minute') { <div timePickerMinuteColumn [step]="item.stepped ? 5 : 1"></div> }
              @case ('second') { <div timePickerSecondColumn [step]="item.stepped ? 10 : 1"></div> }
              @case ('period') { <div timePickerPeriodColumn></div> }
            }
          }
        </div></div></ng-template>
      </div>
    </section>
  }
</div>
