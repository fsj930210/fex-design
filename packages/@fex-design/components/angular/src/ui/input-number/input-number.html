<div
  inputNumberRoot
  [controlled]="hasValue()"
  [value]="valueState()"
  [defaultValue]="defaultValue()"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [precision]="precision()"
  [parser]="parser()"
  [formatter]="formatter()"
  [disabled]="disabled()"
  [readOnly]="readOnly()"
  [keyboard]="keyboard()"
  [size]="size()"
  [variant]="variant()"
  [class]="classNames()?.root"
  [style]="styles()?.root"
  (change)="change.emit($event)"
>
  <span inputPrefix [class]="classNames()?.prefix" [style]="styles()?.prefix">
    <ng-content select="[inputNumberPrefix]" />
  </span>
  <input
    inputNumberControl
    [id]="id()"
    [name]="name()"
    [placeholder]="placeholder()"
    [required]="required()"
    [attr.aria-invalid]="invalid() || null"
    [attr.aria-describedby]="describedBy() || null"
    [class]="classNames()?.control"
    [style]="styles()?.control"
  />
  @if (clearable()) {
  <button inputNumberClear [class]="classNames()?.clear" [style]="styles()?.clear"></button>
  }
  <span inputSuffix [class]="classNames()?.suffix" [style]="styles()?.suffix">
    <ng-content select="[inputNumberSuffix]" />
  </span>
  @if (controls()) {
  <span inputNumberActions [class]="classNames()?.actions" [style]="styles()?.actions">
    <button
      inputNumberIncrement
      [class]="classNames()?.increment"
      [style]="styles()?.increment"
    ></button>
    <button
      inputNumberDecrement
      [class]="classNames()?.decrement"
      [style]="styles()?.decrement"
    ></button>
  </span>
  }
</div>
