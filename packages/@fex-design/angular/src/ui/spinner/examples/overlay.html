<div class="grid w-full max-w-xl gap-4">
  <div
    spinnerContainer
    [spinning]="spinning()"
    text="正在刷新数据"
    class="min-h-40 rounded-lg border border-border"
  >
    <div class="grid gap-2 p-6">
      <strong>项目概览</strong>
      <p class="m-0 text-sm text-muted-foreground">内容在加载期间保持挂载，不会丢失布局和状态。</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="rounded-md bg-primary px-3 py-2 text-sm text-primary-foreground"
      (click)="toggleSpinning()"
    >
      {{ spinning() ? '停止加载' : '开始加载' }}</button
    ><span class="text-sm text-muted-foreground">spinning: {{ spinning() }}</span>
  </div>
</div>
