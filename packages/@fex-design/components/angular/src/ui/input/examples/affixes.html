<ng-template #search><search-icon /></ng-template
><ng-template #code><button button variant="text" size="sm">获取验证码</button></ng-template>
<div class="grid w-full gap-3">
  <div input [prefix]="search" placeholder="Prefix"></div>
  <div input suffix="CNY" placeholder="Suffix"></div>
  <div input prefix="https://" suffix=".com"></div>
  <div input addonBefore="https://" addonAfter=".com"></div>
  <div input [suffix]="code" placeholder="手机号"></div>
</div>
