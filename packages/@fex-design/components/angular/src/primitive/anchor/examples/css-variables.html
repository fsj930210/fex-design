<div
  #container
  class="grid h-80 w-full max-w-2xl grid-cols-[14rem_1fr] gap-6 overflow-auto rounded-xl border p-4"
>
  <nav
    anchorRoot
    [container]="container"
    class="sticky top-0 self-start [--anchor-indent:20px] [--primary:#7c3aed]"
  >
    <div class="[--anchor-indent:20px] [--primary:#7c3aed]" anchorRail>
      <span class="[--anchor-indent:20px] [--primary:#7c3aed]" anchorIndicator></span>
    </div>
    <ul class="[--anchor-indent:20px] [--primary:#7c3aed]" anchorList>
      <li
        class="[--anchor-indent:20px] [--primary:#7c3aed]"
        anchorItem
        value="overview"
        target="#angular-basic-overview"
      >
        <button class="[--anchor-indent:20px] [--primary:#7c3aed]" anchorLink>概览</button>
      </li>
      <li
        class="[--anchor-indent:20px] [--primary:#7c3aed]"
        anchorItem
        value="usage"
        target="#angular-basic-usage"
      >
        <button class="[--anchor-indent:20px] [--primary:#7c3aed]" anchorLink>使用方式</button>
        <ul class="[--anchor-indent:20px] [--primary:#7c3aed]" anchorList>
          <li
            class="[--anchor-indent:20px] [--primary:#7c3aed]"
            anchorItem
            value="api"
            target="#angular-basic-api"
          >
            <button class="[--anchor-indent:20px] [--primary:#7c3aed]" anchorLink>API</button>
          </li>
        </ul>
      </li>
    </ul>
  </nav>
  <div class="grid gap-32 pb-64">
    <section id="angular-basic-overview">
      <h3 class="font-semibold">概览</h3>
      <p class="text-muted-foreground">Anchor 根据滚动位置同步当前章节。</p>
    </section>
    <section id="angular-basic-usage">
      <h3 class="font-semibold">使用方式</h3>
      <p class="text-muted-foreground">点击项目滚动到对应内容。</p>
    </section>
    <section id="angular-basic-api">
      <h3 class="font-semibold">API</h3>
      <p class="text-muted-foreground">通过结构化组件自由组合。</p>
    </section>
  </div>
</div>
