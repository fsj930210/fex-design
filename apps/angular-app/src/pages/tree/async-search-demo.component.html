<div card
  title="Async search and locate"
  description="The real server returns path-aware matches and an ancestor subtree."
>
  <div inputRoot
    [value]="inputValue()"
    (valueChange)="search($event)"
    (clear)="clear()"
    class="mb-2 max-w-sm"
    ><input inputControl placeholder="Search remote departments" /><button inputClear></button
  ></div>
  @if (keyword()) {
    <fex-listbox>
      @for (result of results(); track result.node.id) {
        <fex-listbox-item
          [value]="result.node.id"
          class="cursor-pointer rounded-md px-1.5 py-1"
          (click)="choose(result)"
          ><span class="block text-sm font-medium">{{ result.node.name }}</span
          ><span class="block text-xs text-muted-foreground">
            @for (part of result.path; track part.key; let last = $last) {
              {{ part.label }}{{ last ? '' : ' / ' }}
            }
          </span></fex-listbox-item
        >
      }
    </fex-listbox>
  } @else if (treeData().length) {
    <fex-demo-tree [options]="options()" />
  }
</div>
