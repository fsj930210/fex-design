<div
  card
  title="Suffix and clear"
  description="Suffix replaces actions while clear remains independent."
>
  <div class="grid gap-2 md:grid-cols-3">
    <div inputNumber [clearable]="true" [defaultValue]="20"></div>
    <div inputNumber [defaultValue]="20"><span inputSuffix>kg</span></div>
    <div inputNumber [clearable]="true" [defaultValue]="20"><span inputSuffix>%</span></div>
  </div>
</div>
