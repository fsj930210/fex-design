<div class="grid min-h-80 w-full max-w-xl content-start gap-3">
  <div class="flex gap-2">
    <button button size="sm" (click)="show(false)">默认样式</button>
    <button button size="sm" (click)="show(true)">整体定制</button>
  </div>
  <div
    menuRoot
    layout="vertical"
    [defaultValue]="['overview']"
    [openValues]="open()"
    (openValuesChange)="open.set($event)"
  >
    <div menuContent [class]="'w-44 max-w-full ' + names().root" [style]="partStyles()?.root">
      <button menuItem value="overview" [class]="names().item" [style]="partStyles()?.item">
        概览
      </button>
      <div subMenu value="workspace" [popoverProps]="popup()">
        <button
          subMenuTrigger
          [class]="names().subMenuTrigger"
          [style]="partStyles()?.subMenuTrigger"
        >
          工作空间
        </button>
        <div
          subMenuContent
          [content]="workspaceContent"
          [class]="names().subMenuContent"
          [style]="partStyles()?.subMenuContent"
        ></div>
        <ng-template #workspaceContent>
          <button menuItem value="members" [class]="names().item" [style]="partStyles()?.item">
            成员
          </button>
          <button menuItem value="roles" [class]="names().item" [style]="partStyles()?.item">
            角色
          </button>
          <button
            menuItem
            value="billing"
            [class]="names().item"
            [style]="partStyles()?.item"
            [disabled]="true"
          >
            账单
          </button>
        </ng-template>
      </div>
      <div menuSeparator [class]="names().separator" [style]="partStyles()?.separator"></div>
      <div menuGroup [class]="names().group" [style]="partStyles()?.group">
        <div menuGroupLabel>账户</div>
        <button menuItem value="profile" [class]="names().item" [style]="partStyles()?.item">
          个人资料
        </button>
        <button menuItem value="logout" [class]="names().item" [style]="partStyles()?.item">
          退出登录
        </button>
      </div>
    </div>
  </div>
</div>
