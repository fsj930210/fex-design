<div class="grid w-full gap-4">
  <p>调用方通过受控值保存待确认选择；确认后提交，取消或关闭恢复。</p>
  <div
    timePickerRoot
    [value]="draft()"
    [open]="open()"
    (change)="draft.set($event.value)"
    (openChange)="changeOpen($event)"
  >
    <div timePickerTrigger></div>
    <ng-template popoverPortal
      ><div timePickerContent>
        <div timePickerPanel>
          <div timePickerHourColumn></div>
          <div timePickerMinuteColumn></div>
          <div timePickerSecondColumn></div>
        </div>
        <div class="flex flex-wrap justify-end gap-2 border-t border-border p-2">
          <button button type="button" size="sm" variant="text" (click)="changeOpen(false)">
            取消</button
          ><button
            button
            type="button"
            size="sm"
            color="primary"
            variant="solid"
            (click)="confirm()"
          >
            确认
          </button>
        </div>
      </div></ng-template
    >
  </div>
  <output aria-live="polite">已确认：{{ formatValue(committed()) }}</output>
</div>
