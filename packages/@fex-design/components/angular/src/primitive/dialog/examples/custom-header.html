<button button (click)="open=true">打开 Dialog</button>
<div dialog [open]="open" (openChange)="open=$event[0]">
  <div dialogPortal>
    <div dialogOverlay></div>
    <div dialogContent>
      <div dialogHeader>
        <h2 dialogTitle>自定义标题</h2>
        <div class="text-sm text-muted-foreground">这是自定义 Header 内容</div>
        <button dialogClose iconOnly></button>
      </div>
      <div dialogBody>Dialog custom-header 场景。</div>
      <div dialogFooter>
        <button dialogClose>取消</button
        ><button button variant="solid" color="primary">确定</button>
      </div>
    </div>
  </div>
</div>
