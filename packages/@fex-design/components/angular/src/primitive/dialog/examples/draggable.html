<button button (click)="show()">打开拖拽弹窗</button>
<div dialog [open]="open" (openChange)="setOpen($event)" [modal]="false">
  <div dialogPortal>
    <div dialogContent [style]="style">
      <div dialogHeader>
        <h2 dialogTitle>
          <div
            #handle
            move
            [moveTarget]="panel(handle)"
            [position]="position"
            [applyStyle]="false"
            bounds="viewport"
            (move)="move($event)"
            class="cursor-move touch-none select-none pe-20 font-semibold leading-6"
          >
            拖拽弹窗
          </div>
        </h2>
      </div>
      <div dialogActions><button dialogClose iconOnly></button></div>
      <div dialogBody [class]="'flex-1 min-h-0'">
        <p>按住标题区拖动窗口，窗口保持在展示区域内。</p>
      </div>
      <div dialogFooter [class]="''"><button button (click)="open = false">关闭窗口</button></div>
    </div>
  </div>
</div>
