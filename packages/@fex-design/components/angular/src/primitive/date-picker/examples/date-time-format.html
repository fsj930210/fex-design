<div class="flex w-full min-w-0 flex-col gap-6">
<section class="flex w-full min-w-0 flex-col gap-2"><p class="text-sm font-medium">YYYY-MM-DD HH:mm</p>
<div datePickerRoot format="YYYY-MM-DD HH:mm" [showTime]="true" [defaultValue]="initial">
      <div datePickerTrigger></div>
      <div datePickerContent><div datePickerPanel></div><div datePickerFooter></div></div>
    </div>
</section>
<section class="flex w-full min-w-0 flex-col gap-2"><p class="text-sm font-medium">YYYY-MM-DD HH:mm:ss</p>
<div datePickerRoot format="YYYY-MM-DD HH:mm:ss" [showTime]="true" [defaultValue]="initial">
      <div datePickerTrigger></div>
      <div datePickerContent><div datePickerPanel></div><div datePickerFooter></div></div>
    </div>
</section>
<section class="flex w-full min-w-0 flex-col gap-2"><p class="text-sm font-medium">YYYY-MM-DD hh:mm A</p>
<div datePickerRoot format="YYYY-MM-DD hh:mm A" [showTime]="{ use12Hours: true, step: { minute: 5 } }" [defaultValue]="initial">
      <div datePickerTrigger></div>
      <div datePickerContent><div datePickerPanel></div><div datePickerFooter></div></div>
    </div>
</section>
<section class="flex w-full min-w-0 flex-col gap-2"><p class="text-sm font-medium">选择日期时默认使用 08:30</p>
<div datePickerRoot format="YYYY-MM-DD HH:mm" [showTime]="{ format: 'HH:mm', defaultOpenValue: { hour: 8, minute: 30, second: 0 } }" >
      <div datePickerTrigger></div>
      <div datePickerContent><div datePickerPanel></div><div datePickerFooter></div></div>
    </div>
</section>
</div>
