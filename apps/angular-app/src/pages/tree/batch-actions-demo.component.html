<fex-card
  title="Controller batch actions"
  description="All batch operations are explicit controller actions. selectAll only acts when multiple selection is enabled."
  ><div class="mb-2 flex flex-wrap gap-1.5">
    <button button size="sm" variant="outline" (click)="expansion()?.expandAll()">Expand all</button
    ><button button size="sm" variant="outline" (click)="expansion()?.collapseAll()">
      Collapse all</button
    ><button button size="sm" variant="outline" (click)="selection()?.selectAll()">
      Select all</button
    ><button button size="sm" variant="outline" (click)="selection()?.clear()">
      Clear selection</button
    ><button button size="sm" variant="outline" (click)="check()?.checkAll()">Check all</button
    ><button button size="sm" variant="outline" (click)="check()?.clear()">Clear checks</button>
  </div>
  <fex-demo-tree
    [controller]="controller"
    [options]="options"
    [checkable]="true"
    class="block max-w-xl rounded-md border border-border bg-background p-1.5"
/></fex-card>
