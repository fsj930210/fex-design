<div
  card
  title="Conversation"
  description="Message owns the row and side while Bubble owns the content surface."
>
  <div role="log" class="grid gap-4">
    <fex-message
      ><div fexMessageAvatar>
        <avatar
          ><avatar-image src="/avatar-demo.svg" alt="Assistant" /><avatar-fallback
            >AI</avatar-fallback
          ></avatar
        >
      </div>
      <div fexMessageBody>
        <div fexMessageHeader>Assistant · 10:24</div>
        <div fexMessageContent>
          <fex-bubble variant="plain"
            ><fex-bubble-content
              >I checked the report. Revenue grew 18% compared with last month.</fex-bubble-content
            ></fex-bubble
          >
        </div>
        <div fexMessageFooter>Generated just now</div>
      </div></fex-message
    ><fex-message side="end"
      ><div fexMessageAvatar>
        <avatar><avatar-fallback>ME</avatar-fallback></avatar>
      </div>
      <div fexMessageBody>
        <div fexMessageContent>
          <fex-bubble variant="solid"
            ><fex-bubble-content>Great, break that down by region.</fex-bubble-content></fex-bubble
          >
        </div>
        <div fexMessageFooter>Delivered</div>
      </div></fex-message
    >
  </div>
</div>
