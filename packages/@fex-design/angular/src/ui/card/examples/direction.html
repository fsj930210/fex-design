<ng-template #extra><button class="rounded-md border px-3 py-1.5 text-sm">操作</button></ng-template
><ng-template #footer
  ><button class="rounded-md bg-primary px-3 py-1.5 text-primary-foreground">
    保存
  </button></ng-template
>
<div class="grid w-full gap-6 sm:grid-cols-2">
  @for (dir of directions; track dir) {
  <div
    card
    [attr.dir]="dir"
    [title]="dir.toUpperCase()"
    description="Header 与 Footer 按逻辑方向排列。"
    [extra]="extraTemplate()"
    [footer]="footerTemplate()"
  >
    内容区域保持可读顺序。
  </div>
  }
</div>
