<div class="grid w-full max-w-md gap-3">
  <div class="flex items-center gap-3"><span class="w-12 text-sm text-muted-foreground">直角</span>
    <div progressRoot [value]="50" class="flex flex-1 flex-col"><div class="flex w-full items-center"><div progressTrack class="min-w-0 flex-1" style="border-radius: 0px;"><div progressRange style="border-radius: 0px;"></div></div><span progressValue class="ms-2 shrink-0 text-sm font-medium">50%</span></div></div>
  </div>
  <div class="flex items-center gap-3"><span class="w-12 text-sm text-muted-foreground">小圆角</span>
    <div progressRoot [value]="50" class="flex flex-1 flex-col"><div class="flex w-full items-center"><div progressTrack class="min-w-0 flex-1" style="border-radius: 2px;"><div progressRange style="border-radius: 2px;"></div></div><span progressValue class="ms-2 shrink-0 text-sm font-medium">50%</span></div></div>
  </div>
  <div class="flex items-center gap-3"><span class="w-12 text-sm text-muted-foreground">胶囊</span>
    <div progressRoot [value]="50" class="flex flex-1 flex-col"><div class="flex w-full items-center"><div progressTrack class="min-w-0 flex-1" style="border-radius: 9999px;"><div progressRange style="border-radius: 9999px;"></div></div><span progressValue class="ms-2 shrink-0 text-sm font-medium">50%</span></div></div>
  </div>
</div>
