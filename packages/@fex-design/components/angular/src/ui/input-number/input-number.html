<div
  inputNumberRoot
  [value]="resolvedValue()"
  [defaultValue]="defaultValue()"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [disabled]="disabled()"
  [readOnly]="readOnly()"
  (change)="handleChange($event)"
>
  <input
    inputNumberControl
    [value]="resolvedValue() ?? ''"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [disabled]="disabled()"
    [readOnly]="readOnly()"
  />
  @if (controls() !== false) {
  <span inputNumberActions
    ><button inputNumberIncrement></button><button inputNumberDecrement></button
  ></span>
  }
</div>
