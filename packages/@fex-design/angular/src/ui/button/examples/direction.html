<div class="grid w-full gap-6 sm:grid-cols-2">
  @for (direction of ['ltr', 'rtl']; track direction) {
  <section class="grid gap-3 rounded-lg border p-4">
    <strong>{{ direction.toUpperCase() }}</strong>
    <div class="flex flex-wrap gap-3">
      <button button [attr.dir]="direction"><plus-icon slot="start" />Start icon</button
      ><button button [attr.dir]="direction" iconPlacement="end">End icon<plus-icon slot="end" /></button>
    </div>
    <div buttonGroup [attr.dir]="direction">
      <button button>First</button><button button>Middle</button><button button>Last</button>
    </div>
  </section>
  }
</div>
