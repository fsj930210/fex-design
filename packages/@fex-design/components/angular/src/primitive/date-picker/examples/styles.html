<div class="flex w-full min-w-0 flex-col gap-6">
  <section class="flex w-full min-w-0 flex-col gap-2">
    <p class="text-sm font-medium">默认样式</p>
    <div datePickerRoot [defaultValue]="date">
      <div datePickerTrigger></div>
      <div datePickerContent>
        <div datePickerPanel></div>
        <div datePickerFooter></div>
      </div>
    </div>
    <div rangePickerRoot [defaultValue]="range">
      <div rangePickerTrigger></div>
      <div rangePickerContent>
        <div rangePickerPanelGroup></div>
        <div datePickerFooter></div>
      </div>
    </div>
  </section>
  <section class="flex w-full min-w-0 flex-col gap-2">
    <p class="text-sm font-medium">紫色自定义样式</p>
    <div datePickerRoot [defaultValue]="date" [inputProps]="inputAppearance" [calendarProps]="calendarAppearance" [popoverProps]="popupAppearance" [classNames]="partClasses">
      <div datePickerTrigger></div>
      <div datePickerContent>
        <div datePickerPanel></div>
        <div datePickerFooter></div>
      </div>
    </div>
    <div rangePickerRoot [defaultValue]="range" [inputProps]="inputAppearance" [calendarProps]="calendarAppearance" [popoverProps]="popupAppearance" [classNames]="partClasses">
      <div rangePickerTrigger></div>
      <div rangePickerContent>
        <div rangePickerPanelGroup></div>
        <div datePickerFooter></div>
      </div>
    </div>
  </section>
</div>
