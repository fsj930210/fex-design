<main class="grid gap-4 p-2 md:p-6">
  <div card title="基本" description="Text、Avatar、Button、Input 与 Block。">
    <div class="grid gap-4">
      <div skeletonText class="w-64"></div>
      <div class="flex gap-3"><div skeletonAvatar></div><div skeletonAvatar shape="square"></div></div>
      <div class="flex gap-3"><div skeletonButton></div><div skeletonButton shape="round"></div></div>
      <div skeletonInput></div>
      <div skeletonBlock class="h-20 w-64"></div>
    </div>
  </div>
  <div card title="列表" description="头像与多行文本组合。">
    <div class="grid max-w-xl gap-5">
      @for (row of rows; track row) {
        <div class="flex items-start gap-3">
          <div skeletonAvatar size="lg"></div>
          <div class="grid flex-1 gap-2">
            <div skeletonText class="w-2/5"></div><div skeletonText></div><div skeletonText class="w-4/5"></div>
          </div>
        </div>
      }
    </div>
  </div>
  <div card title="图片内容" description="图片、标题与正文组合。">
    <div class="grid max-w-sm gap-3">
      <div skeletonImage class="aspect-video w-full"></div><div skeletonText class="w-3/5"></div><div skeletonText></div>
    </div>
  </div>
  <div card title="动画" description="无动画、呼吸与流光。">
    <div class="grid max-w-sm gap-3">
      <div skeletonText animation="none"></div><div skeletonText animation="pulse"></div><div skeletonText animation="wave"></div>
    </div>
  </div>
</main>
