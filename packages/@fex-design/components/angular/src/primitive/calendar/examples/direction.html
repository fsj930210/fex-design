<div class="grid gap-6">
  <section dir="ltr" class="min-w-0 rounded-lg border p-3">
    <strong class="mb-3 block">LTR · English</strong>
    <div
      calendarRoot
      [defaultViewDate]="ltrOptions.defaultViewDate"
      [locale]="ltrOptions.locale"
      [weekStartsOn]="ltrOptions.weekStartsOn ?? 0"
      [showWeek]="ltrOptions.showWeek"
      [fullscreen]="ltrOptions.fullscreen"
      [class]="rootClass"
      [attr.data-fullscreen]="true"
    >
      <div calendarExampleContent [options]="ltrOptions"></div>
    </div>
  </section>
  <section dir="rtl" class="min-w-0 rounded-lg border p-3">
    <strong class="mb-3 block">RTL · العربية</strong>
    <div
      calendarRoot
      [defaultViewDate]="rtlOptions.defaultViewDate"
      [locale]="rtlOptions.locale"
      [weekStartsOn]="rtlOptions.weekStartsOn ?? 0"
      [showWeek]="rtlOptions.showWeek"
      [fullscreen]="rtlOptions.fullscreen"
      [class]="rootClass"
      [attr.data-fullscreen]="true"
    >
      <div calendarExampleContent [options]="rtlOptions"></div>
    </div>
  </section>
</div>
