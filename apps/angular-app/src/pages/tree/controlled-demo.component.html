<fex-card title="Controlled state" description="Expansion and selection can be owned outside Tree."
  ><div class="mb-2 flex flex-wrap gap-1.5">
    <button
      fexButton
      size="sm"
      variant="outline"
      (click)="expanded.set(['company', 'engineering', 'product'])"
    >
      Expand departments</button
    ><button fexButton size="sm" variant="outline" (click)="selectFrontend()">
      Select Frontend
    </button>
  </div>
  <fex-demo-tree
    [options]="options()"
    class="block max-w-xl rounded-md border border-border bg-background p-1.5"
/></fex-card>
