<section class="grid w-full gap-space-sm">
  <p class="text-xs text-muted-foreground">
    id → key；name → title；leaf → isLeaf；unavailable → disabled。
  </p>
  <div class="max-h-64 overflow-y-auto">
    <div treeRoot [options]="options">
      <div treeViewport>
        <ng-template let-item>
          <div [treeItem]="item.key">
            @if (!item.isLeaf) {
            <button [treeTrigger]="item.key"><svg chevronDownIcon class="size-4"></svg></button> }
            @else { <span aria-hidden="true" class="size-5 shrink-0"></span> }<span treeTitle
              >{{ item.data[fieldNames.title] }}</span
            >
          </div>
        </ng-template>
      </div>
    </div>
  </div>
  <output class="min-h-5 break-all text-xs text-muted-foreground" aria-live="polite"
    >已选 ID：{{ selected().join(', ') || '无' }}</output
  >
</section>
