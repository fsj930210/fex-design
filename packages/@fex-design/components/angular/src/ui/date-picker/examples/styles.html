<div class="flex w-full min-w-0 flex-col gap-6">
  <section class="flex w-full min-w-0 flex-col gap-2">
    <p class="text-sm font-medium">默认样式</p>
    <div datePicker [defaultValue]="date"></div>
    <div rangePicker [defaultValue]="range"></div>
  </section>
  <section class="flex w-full min-w-0 flex-col gap-2">
    <p class="text-sm font-medium">紫色自定义样式</p>
    <div datePicker [defaultValue]="date" [inputProps]="inputAppearance" [calendarProps]="calendarAppearance" [popoverProps]="popupAppearance" [classNames]="partClasses"></div>
    <div rangePicker [defaultValue]="range" [inputProps]="inputAppearance" [calendarProps]="calendarAppearance" [popoverProps]="popupAppearance" [classNames]="partClasses"></div>
  </section>
</div>
