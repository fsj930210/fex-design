<button button (click)="open=true">打开 Dialog</button>
<div dialog [open]="open" (openChange)="open=$event[0]">
  <div dialogPortal>
    <div dialogOverlay></div>
    <div dialogContent class="top-[200px] translate-y-0">
      <div dialogHeader><h2 dialogTitle>位置</h2></div>
      <div dialogActions><button dialogClose iconOnly></button></div>
      <div dialogBody>Dialog position 场景。</div>
      <div dialogFooter>
        <button dialogClose>取消</button
        ><button button variant="solid" color="primary">确定</button>
      </div>
    </div>
  </div>
</div>
