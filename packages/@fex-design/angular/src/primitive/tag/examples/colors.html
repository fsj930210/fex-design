<div class="grid gap-4">@for (variant of variants; track variant) {<section class="grid gap-2"><h4 class="text-sm font-medium">预设颜色（{{ variant }}）</h4><div class="flex flex-wrap gap-2">@for (color of presets; track color) {<span tag [color]="color" [variant]="variant">{{ color }}</span>}</div></section>} @for (variant of variants; track variant) {<section class="grid gap-2"><h4 class="text-sm font-medium">自定义颜色（{{ variant }}）</h4><div class="flex flex-wrap gap-2">@for (color of customColors; track color) {<span tag [color]="color" [variant]="variant">{{ color }}</span>}</div></section>}</div>
