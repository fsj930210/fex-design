<div class="w-[min(36rem,100%)] min-w-0">
  <p class="mb-space-sm min-h-10 break-all text-sm text-muted-foreground">{{message()}}</p>
  <div
    tree
    [treeData]="treeData()"
    [disabled]="busy()"
    [expandedKeys]="expandedKeys()"
    (expand)="expandedKeys.set($event.keys)"
    [draggable]="true"
    (drop)="handleDrop($event)"
  ></div>
</div>
