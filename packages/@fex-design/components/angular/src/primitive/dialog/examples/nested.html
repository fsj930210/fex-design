<button button (click)="open=true">打开外层弹窗</button>
<div dialog [open]="open" (openChange)="setOpen($event)">
  <div dialogPortal>
    <div dialogOverlay></div>
    <div dialogContent>
      <div dialogHeader><h2 dialogTitle>外层弹窗</h2></div>
      <div dialogActions><button dialogClose iconOnly></button></div>
      <div dialogBody>
        <p>外层内容会保留。</p>
        <button button (click)="innerOpen=true">打开内层弹窗</button>
        <div dialog [open]="innerOpen" (openChange)="setOpen($event, true)">
          <div dialogPortal>
            <div dialogOverlay></div>
            <div dialogContent>
              <div dialogHeader><h2 dialogTitle>内层弹窗</h2></div>
              <div dialogActions><button dialogClose iconOnly></button></div>
              <div dialogBody><p>关闭此弹窗后，外层弹窗仍然保留。</p></div>
              <div dialogFooter><button button (click)="innerOpen=false">关闭内层</button></div>
            </div>
          </div>
        </div>
      </div>
      <div dialogFooter><button button (click)="open=false">关闭外层</button></div>
    </div>
  </div>
</div>
