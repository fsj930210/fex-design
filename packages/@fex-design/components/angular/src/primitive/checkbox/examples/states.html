<div class="grid gap-3">
  <div checkboxRoot>
    <input checkboxControl type="checkbox" /><span checkboxIndicator></span
    ><label checkboxLabel>未选中</label>
  </div>
  <div checkboxRoot>
    <input checkboxControl type="checkbox" defaultChecked /><span checkboxIndicator></span
    ><label checkboxLabel>已选中</label>
  </div>
  <div checkboxRoot>
    <input checkboxControl type="checkbox" indeterminate /><span checkboxIndicator></span
    ><label checkboxLabel>中间状态</label>
  </div>
  <div checkboxRoot>
    <input checkboxControl type="checkbox" disabled /><span checkboxIndicator></span
    ><label checkboxLabel>禁用</label>
  </div>
  <div checkboxRoot>
    <input checkboxControl type="checkbox" defaultChecked disabled /><span checkboxIndicator></span
    ><label checkboxLabel>禁用且已选中</label>
  </div>
</div>
