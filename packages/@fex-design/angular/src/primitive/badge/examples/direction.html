<div class="flex items-center justify-center gap-12">
  <div dir="ltr" class="grid justify-items-center gap-2">
    <span>LTR</span
    ><span class="relative inline-flex"
      ><span class="block size-10 rounded bg-muted-background"></span
      ><badge
        [count]="5"
        class="absolute end-0 top-0 z-10 -translate-y-1/2 translate-x-1/2 rtl:-translate-x-1/2"
      ></badge
    ></span>
  </div>
  <div dir="rtl" class="grid justify-items-center gap-2">
    <span>RTL</span
    ><span class="relative inline-flex"
      ><span class="block size-10 rounded bg-muted-background"></span
      ><badge
        [count]="5"
        class="absolute end-0 top-0 z-10 -translate-y-1/2 translate-x-1/2 rtl:-translate-x-1/2"
      ></badge
    ></span>
  </div>
</div>
