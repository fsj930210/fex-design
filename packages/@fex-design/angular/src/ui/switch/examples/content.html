<div class="grid gap-6 sm:grid-cols-2">
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">rounded</span>
    <div class="flex flex-wrap items-center gap-3">
      <button
        switch
        shape="rounded"
        defaultChecked
        checkedContent="开启"
        uncheckedContent="关闭"
        aria-label="rounded 文字开关"
      ></button
      ><button
        switch
        shape="rounded"
        checkedContent="开启"
        uncheckedContent="关闭"
        aria-label="rounded 文字开关"
      ></button
      ><button
        switch
        shape="rounded"
        [checkedContent]="checkedIcon"
        [uncheckedContent]="uncheckedIcon"
        aria-label="rounded 图标开关"
      ></button>
    </div>
  </section>
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">pill</span>
    <div class="flex flex-wrap items-center gap-3">
      <button
        switch
        shape="pill"
        defaultChecked
        checkedContent="开启"
        uncheckedContent="关闭"
        aria-label="pill 文字开关"
      ></button
      ><button
        switch
        shape="pill"
        checkedContent="开启"
        uncheckedContent="关闭"
        aria-label="pill 文字开关"
      ></button
      ><button
        switch
        shape="pill"
        [checkedContent]="checkedIcon"
        [uncheckedContent]="uncheckedIcon"
        aria-label="pill 图标开关"
      ></button>
    </div>
  </section>
  <ng-template #checkedIcon><ng-container *ngComponentOutlet="checkIcon" /></ng-template
  ><ng-template #uncheckedIcon><ng-container *ngComponentOutlet="xIcon" /></ng-template>
</div>
