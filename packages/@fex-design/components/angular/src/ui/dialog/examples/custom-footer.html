<div
  dialogUi
  [open]="open"
  (openChange)="onOpenChange($event)"
  [title]="'自定义 Footer'"
  [hasFooter]="true"
>
  <button button dialogTrigger>打开 Dialog</button>
  <p>Dialog custom-footer 场景。</p>

    ><button button variant="solid" color="primary">确定</button>
  </div>
</div>
