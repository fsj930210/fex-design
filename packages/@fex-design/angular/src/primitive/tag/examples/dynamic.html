<div class="grid gap-3"><div class="flex flex-wrap gap-2">@for (item of tags(); track item.id) {<span tag color="primary">{{ item.label }}<button tagClose [attr.aria-label]="'删除' + item.label" (click)="removeTag(item.id)"></button></span>}</div><div class="flex gap-2"><input #name class="h-8 rounded-md border px-2 text-sm" placeholder="输入标签名称" /><button type="button" class="h-8 rounded-md bg-primary px-3 text-sm text-primary-foreground" (click)="addTag(name)">添加标签</button></div></div>
