<div class="grid w-full gap-3">@if (visible()) { <div alert type="warning"><span alertIcon><circle-warning-icon /></span><div alertTitle>这条提示可以关闭</div><button [class]="alertCloseClassName" data-slot="alert-close" aria-label="关闭提示" (click)="visible.set(false)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button></div> } @else { <button (click)="visible.set(true)">重新显示</button> }<div alert><div alertTitle>阻止默认关闭</div><div alertDescription>关闭事件被阻止后保持显示。</div><button [class]="alertCloseClassName" data-slot="alert-close" aria-label="关闭提示" (click)="$event.preventDefault()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button></div></div>
