<div class="w-full flex items-center justify-center min-h-[480px] py-16">
  <div class="grid gap-4">
    <label
      >浮层与触发元素距离 {{ sideOffset() }}px
      <input
        #sideInput
        type="range"
        min="0"
        max="40"
        [value]="sideOffset()"
        (input)="sideOffset.set(+sideInput.value)"
    /></label>
    <label
      >面板与触发元素对齐偏移 {{ alignOffset() }}px
      <input
        #alignInput
        type="range"
        min="-40"
        max="40"
        [value]="alignOffset()"
        (input)="alignOffset.set(+alignInput.value)"
    /></label>
    <div class="flex flex-wrap justify-center gap-16 pt-12 pb-24">
      @for (item of cases(); track item.label) {
      <div>
        <div
          popoverRoot
          #panel
          [open]="options(item).open"
          [trigger]="options(item).trigger"
          [placement]="options(item).placement"
          [arrow]="options(item).arrow"
          [arrowPadding]="options(item).arrowPadding"
          [align]="options(item).align"
          [side]="options(item).side"
          [avoidCollisions]="false"
          [sideOffset]="options(item).sideOffset"
          [alignOffset]="options(item).alignOffset"
          [getPopupContainer]="options(item).getPopupContainer"
          [lazyMount]="options(item).lazyMount"
          [destroyOnHidden]="options(item).destroyOnHidden"
          title="提示信息"
          [content]="body"
        >
          <button button popoverTrigger>{{ item.label }}</button>
          <ng-template #body>
            <p>这里可以放置说明和交互内容。</p>
          </ng-template>
        </div>
      </div>
      }
    </div>
  </div>
</div>
