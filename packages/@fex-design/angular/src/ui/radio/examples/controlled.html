<div class="grid gap-3"><div class="flex gap-2"><button button size="sm" (click)="value.set('apple')">选择苹果</button><button button size="sm" (click)="value.set('pear')">选择梨</button></div><div radioGroup [value]="value()" (valueChange)="value.set($event.value)" orientation="horizontal"><div radio value="apple">苹果</div><div radio value="pear">梨</div></div><div radioGroup defaultValue="apple" orientation="horizontal"><div radio value="apple">非受控：苹果</div><div radio value="pear">非受控：梨</div></div></div>
<div radioGroup [value]="value()" (valueChange)="value.set($event.value)" orientation="horizontal" class="gap-0"><button radioButton value="apple">苹果按钮</button><button radioButton value="pear">梨按钮</button></div>
