<div class="flex w-full flex-wrap gap-6">
  <section class="grid gap-3">
    <h4 class="text-sm font-medium">各轴部件独立设置 classNames/styles</h4>
    <div
      scrollbar
      showTrack
      class="h-48 w-72 rounded-md border"
      [autoHide]="'never'"
      [overflow]="{'x':'auto','y':'auto'}"
      [classNames]="{'viewport':'bg-muted-background/30','barX':'z-20','barY':'z-20','trackX':'bg-primary/15','trackY':'bg-primary/15','thumbX':'bg-primary','thumbY':'bg-primary','corner':'bg-primary/15'}"
      [styles]="{'viewport':{'backgroundColor':'var(--background)'},'barX':{'insetInlineStart':'16px'},'barY':{'top':'16px'},'trackX':{'borderRadius':'4px'},'trackY':{'borderRadius':'4px'},'thumbX':{'borderRadius':'4px'},'thumbY':{'borderRadius':'4px'},'corner':{'borderRadius':'2px'}}"
    >
      <div class="grid w-[40rem] gap-3 p-4">
        @for (line of lines; track line) {
        <p>{{ line }}</p>
        }
      </div>
    </div>
  </section>
</div>
