<div class="flex w-full flex-wrap gap-6">
  <section class="grid gap-3"><h4 class="text-sm font-medium">尺寸、内边距、圆角、轨道、滑块及交角颜色</h4>
    <div scrollbarRoot showTrack class="h-48 w-72 rounded-md border" [autoHide]="'never'" [overflow]="{'x':'auto','y':'auto'}" style="--scrollbar-size:12px;--scrollbar-padding:2px;--scrollbar-radius:6px;--scrollbar-track-color:#e0e7ff;--scrollbar-thumb-color:#6366f1;--scrollbar-thumb-hover-color:#4f46e5;--scrollbar-thumb-active-color:#312e81;--scrollbar-corner-color:#e0e7ff;--scrollbar-transition-duration:250ms"><div scrollbarViewport><div class="grid w-[40rem] gap-3 p-4">@for (line of lines; track line) {<p>{{ line }}</p>}</div></div>
      <div scrollbarBar [axis]="'x'"><div scrollbarTrack [axis]="'x'"><div scrollbarThumb [axis]="'x'"></div></div></div>
      <div scrollbarBar [axis]="'y'"><div scrollbarTrack [axis]="'y'"><div scrollbarThumb [axis]="'y'"></div></div></div>
      <div scrollbarCorner></div></div>
  </section>
</div>
