<div
  inputRoot
  popoverTrigger
  [value]="text()"
  [disabled]="root.disabled()"
  [readOnly]="root.readOnly()"
  (valueChange)="inputText($event)"
  (clear)="clear()"
>
  @if (prefix()) {
  <span inputPrefix><ng-container *ngTemplateOutlet="prefix()!.template" /></span> }
  <input
    inputControl
    [attr.aria-invalid]="invalid() || null"
    aria-label="Time"
    [placeholder]="placeholder() ?? root.resolvedFormat()"
  />
  @if (allowClear()) { <button inputClear type="button"></button> } @if (!allowClear() || !text()) {
  <span inputSuffix
    >@if (suffix()) { <ng-container *ngTemplateOutlet="suffix()!.template" /> } @else {
    <fex-clock-icon class="size-4" /> }</span
  >
  }
</div>
