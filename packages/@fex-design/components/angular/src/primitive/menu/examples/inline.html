<div class="grid w-full max-w-xs gap-3">
  <p>点击工作空间和设置，观察内嵌展开。</p>
  <div menuRoot layout="inline">
    <div menuContent aria-label="inline menu">
      <button menuItem value="overview">概览</button>
      <div subMenu value="workspace">
        <button subMenuTrigger>工作空间</button>
        <div subMenuContent [content]="workspaceContent1"></div>
        <ng-template #workspaceContent1
          ><button menuItem value="members">成员</button>
          <div subMenu value="settings">
            <button subMenuTrigger>设置</button>
            <div subMenuContent [content]="settingsContent1"></div>
            <ng-template #settingsContent1
              ><button menuItem value="general">通用设置</button
              ><button menuItem value="billing" [disabled]="true">账单</button></ng-template
            >
          </div></ng-template
        >
      </div>
      <button menuItem value="profile">个人资料</button>
    </div>
  </div>
</div>
