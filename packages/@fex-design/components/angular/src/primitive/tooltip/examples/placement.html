<div class="w-full flex items-center justify-center min-h-[600px] py-16">
  <div class="grid w-full gap-4 overflow-visible">
    <p>四个方向 × 三种对齐，共 12 个位置；本例关闭自动避让，浮层始终保持所选方向。</p>
    <div
      class="grid grid-cols-[repeat(5,5rem)] grid-rows-[repeat(5,2.25rem)] justify-center gap-3 px-8 py-28 [&_button]:h-9 [&_button]:w-20 [&_button]:justify-center [&_button]:px-2"
    >
      @for (item of cases; track item.placement) {
      <div [style.grid-area]="item.cell">
        <div tooltipRoot [placement]="item.placement" [avoidCollisions]="false">
          <button button tooltipTrigger variant="outlined">{{ item.placement }}</button
          ><ng-template tooltipPortal
            ><div tooltipContent>
              {{ item.placement }}
              <div tooltipArrow></div></div
          ></ng-template>
        </div>
      </div>
      }
    </div>
  </div>
</div>
