<div class="grid w-full gap-space-sm">
  <p class="text-sm text-muted-foreground">
    展开 Lazy department，加载期间显示 Spinner，完成后显示子节点。
  </p>
  <div treeRoot [options]="options()">
    <div treeViewport>
      <ng-template let-item
        ><div [treeItem]="item.key" #state="treeItem">
          @if(state.loadState() === 'loading'){<span
            spinner
            size="sm"
            aria-label="Loading children"
          ></span
          >}@else{<button [treeTrigger]="item.key"></button>}<span treeTitle
            >{{item.data.title}}</span
          >
        </div></ng-template
      >
    </div>
  </div>
</div>
