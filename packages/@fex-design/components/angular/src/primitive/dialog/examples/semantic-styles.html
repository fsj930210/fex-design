<button button (click)="open=true">打开 Dialog</button>
<div dialog [open]="open" (openChange)="open=$event[0]">
  <div dialogPortal>
    <div dialogOverlay></div>
    <div
      dialogContent
      class="top-[80px] left-[24px] translate-x-0 translate-y-0 w-[calc(100%-48px)] max-w-[480px]"
    >
      <div dialogHeader class="bg-blue-100">
        <h2 dialogTitle class="text-xl text-blue-900">Semantic Styles</h2>
      </div>
      <div dialogActions><button dialogClose iconOnly></button></div>
      <div dialogBody class="bg-blue-50 p-8 text-base text-blue-950">
        通过结构化样式设置 top: 80px、left: 24px，并分别定制标题区、正文和页脚的颜色。
      </div>
      <div dialogFooter class="justify-start gap-4 bg-indigo-100">
        <button dialogClose>取消</button
        ><button button variant="solid" color="primary">确定</button>
      </div>
    </div>
  </div>
</div>
