<section class="grid w-full gap-space-sm">
  <p class="text-sm text-muted-foreground">
    共 {{count}} 个节点，240px 高度，仅渲染可视区域附近的行。
  </p>
  <button button (click)="viewport()?.scrollTo(target,{reveal:true})">定位 Item 80.4.8</button>
  <div treeRoot [options]="options">
    <div treeVirtualViewport [height]="240">
      <ng-template let-item
        ><div [treeItem]="item.key">
          <button [treeTrigger]="item.key"></button><span treeTitle>{{item.data.title}}</span>
        </div></ng-template
      >
    </div>
  </div>
</section>
