<div class="grid w-full gap-space-lg">
  @for (direction of directions; track direction) {
  <section class="grid gap-space-sm">
    <h3 class="font-medium">{{ direction === 'ltr' ? 'LTR · 从左向右' : 'RTL · 从右向左' }}</h3>
    <div [dir]="direction" class="h-64 overflow-y-auto">
      <div treeRoot [options]="options">
        <div treeViewport>
          <ng-template let-item
            ><div [treeItem]="item.key">
              <button [treeTrigger]="item.key"></button><span treeTitle>{{ item.data.title }}</span>
            </div></ng-template
          >
        </div>
      </div>
    </div>
  </section>
  }
</div>
