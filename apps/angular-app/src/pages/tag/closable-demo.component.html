<div card title="可关闭" description="closable 只展示关闭按钮，外部通过 close 事件决定是否移除。">
  <div class="flex flex-wrap items-center gap-2">
    @for (item of items(); track item) {
      <span tag
        >{{ item }}<button tagAction aria-label="移除标签" (click)="remove(item)"></button
      ></span>
    }
    <span tag>无回调<button tagAction aria-label="移除标签"></button></span
    ><span tag disabled>禁用<button tagAction aria-label="移除标签" disabled></button></span>
  </div>
</div>
