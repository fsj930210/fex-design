<div class="grid w-full gap-space-lg">
  <div class="flex flex-wrap gap-2">
    <button button (click)="setPage()">设为第 5 页</button
    ><button button (click)="setPageSize()">每页 20 条</button>
    <button button (click)="total.set(35)">总数改为 35 条</button
    ><button button (click)="reset()">重置</button>
  </div>
  <p class="text-sm text-muted-foreground">
    外部值：第 {{ value().page }} 页，每页 {{ value().pageSize }} 条，总数 {{ total() }} 条
  </p>
  <p aria-live="polite" class="text-sm text-muted-foreground">{{ lastChange() }}</p>
  <nav
    pagination
    [total]="total()"
    [labels]="labels"
    [page]="value().page"
    [pageSize]="value().pageSize"
    (change)="change($event)"
    showTotal
    showSizeChanger
    showQuickJumper
  ></nav>
</div>
