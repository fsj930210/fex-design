<main class="min-h-screen bg-secondary-background px-2 md:px-6 py-4">
  <div class="mx-auto w-full max-w-5xl space-y-4">
    <header class="space-y-2">
      <a class="text-sm text-muted-foreground hover:text-foreground" routerLink="/">Back home</a>
      <h1 class="text-2xl font-semibold text-foreground">Kbd</h1>
      <p class="max-w-2xl text-sm leading-6 text-muted-foreground">
        Display keyboard keys and shortcut combinations.
      </p>
    </header>
    <fex-card title="Shortcuts" description="Single keys and key combinations."
      ><div class="flex min-w-0 flex-wrap items-center gap-3">
        <kbd fexKbd>Esc</kbd><fex-kbd-group><kbd fexKbd>Ctrl</kbd><kbd fexKbd>K</kbd></fex-kbd-group
        ><fex-kbd-group><kbd fexKbd>Cmd</kbd><kbd fexKbd>Enter</kbd></fex-kbd-group>
      </div></fex-card
    >
  </div>
</main>
