<div calendarRoot
  [value]="null"
  [range]="displayRange()"
  [viewDate]="viewDate()"
  [panel]="state.context().panel"
  [granularity]="getGranularityByPicker(state.context().picker)"
  [weekStartsOn]="state.context().weekStartsOn"
  [min]="state.context().minDate"
  [max]="state.context().maxDate"
  [disabledDate]="disabledDate.bind(this)"
  (select)="selectValue($event.value)"
  (cellHover)="hoverCell($event)"
  (viewDateChange)="state.setViewDate($event)"
  (panelChange)="state.setPanel($event)"
  [class]="panelClassName"
>
  <div datePickerHeader>
    <div [class]="headerSideClassName">
      <button datePickerHeaderButton [action]="primaryPreviousAction()"></button>
      @if (state.context().panel === 'date') {
      <button datePickerHeaderButton action="previous-month"></button>
      }
    </div>
    <div datePickerHeaderTitle>
      <button datePickerHeaderLabel part="year"></button>
      <button datePickerHeaderLabel part="month"></button>
    </div>
    <div [class]="headerSideClassName">
      @if (state.context().panel === 'date') {
      <button datePickerHeaderButton action="next-month"></button>
      }
      <button datePickerHeaderButton [action]="primaryNextAction()"></button>
    </div>
  </div>
  @if (state.context().panel === 'date') {
  <div calendarWeekHeader [class]="weekHeaderClassName" />
  }
  <div calendarGrid [class]="gridClassName">
    <ng-template let-cell>
      <div calendarCell [cell]="cell" [class]="cellClassName"></div>
    </ng-template>
  </div>
</div>
