<fex-card
  title="Arbitrary fractions"
  description="step controls interaction precision, while read-only values preserve their exact fraction."
  ><div class="grid gap-3">
    <div class="grid gap-1.5">
      <fex-rate
        [value]="value()"
        [step]="0.1"
        [getValueText]="getValueText"
        (valuePreviewChange)="previewValue.set($event)"
        (valueChange)="value.set($event)"
        aria-label="Decimal rating"
      />
      <p class="text-sm text-muted-foreground">Interactive value: {{ displayValue() }}</p>
    </div>
    <div class="grid gap-1.5">
      <fex-rate [value]="4.37" readOnly aria-label="Exact read-only rating" />
      <p class="text-sm text-muted-foreground">Read-only value: 4.37</p>
    </div>
  </div></fex-card
>
