<div class="grid w-full gap-3">
  <div inputRoot defaultValue="secret">
    <input inputControl [type]="firstVisible()?'text':'password'" /><span inputSuffix
      ><button
        type="button"
        [class]="actionClassName"
        aria-label="Toggle password"
        [attr.aria-pressed]="firstVisible()"
        (click)="firstVisible.set(!firstVisible())"
      >
        @if(firstVisible()){<eye-off-icon />}@else{<eye-icon />}
      </button></span
    >
  </div>
  <div inputRoot><input inputControl type="password" placeholder="无切换按钮" /></div>
  <div inputRoot defaultValue="wrong-password">
    <input inputControl [type]="invalidVisible()?'text':'password'" aria-invalid="true" /><button
      inputClear
    ></button
    ><span inputSuffix
      ><button
        type="button"
        [class]="actionClassName"
        aria-label="Toggle password"
        [attr.aria-pressed]="invalidVisible()"
        (click)="invalidVisible.set(!invalidVisible())"
      >
        @if(invalidVisible()){<eye-off-icon />}@else{<eye-icon />}
      </button></span
    >
  </div>
</div>
