<div
  card
  title="Remote search"
  description="The mock request waits two seconds, cancels stale keywords and returns matches."
>
  <div class="max-w-md">
    <div selectRoot
      [showSearch]="true"
      [loading]="loading"
      [open]="open"
      [items]="options"
      (openChange)="open = $event"
      (search)="search($event)"
      ><div selectTrigger placeholder="请输入关键词远程搜索" ></div><div selectContent
        ><div selectList
          loadingText="Searching remote options..."
          emptyText="No remote results" ></div></div
    ></div>
  </div>
</div>
