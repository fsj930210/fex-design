@for (row of grid().rows; track rowKey(row)) {
  <div calendarRow>
    @for (cell of row; track cell.key) {
      @if (cellTemplate()) {
        <ng-container [ngTemplateOutlet]="cellTemplate()" [ngTemplateOutletContext]="{ $implicit: cell, cell }" />
      } @else { <div calendarCell [cell]="cell"></div> }
    }
  </div>
}
