<main class="min-h-screen bg-secondary-background px-2 md:px-6 py-4">
  <div class="mx-auto w-full max-w-5xl space-y-4">
    <header class="space-y-2">
      <a class="text-sm text-muted-foreground hover:text-foreground" routerLink="/">Back home</a>
      <h1 class="text-2xl font-semibold text-foreground">Empty</h1>
      <p class="max-w-2xl text-sm leading-6 text-muted-foreground">
        Use empty states when lists, search results, or filters return no data.
      </p>
    </header>
    <div card title="Primitive" description="Media, title, description, and content slots.">
      <div empty>
        <div emptyHeader>
          <div emptyMedia><svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect width="48" height="48" rx="12" fill="currentColor" opacity="0.1" /></svg></div>
          <div emptyTitle>No approval tasks</div>
          <p emptyDescription>Adjust filters and try again, or create a new workflow record.</p>
        </div>
        <div emptyContent><badge variant="outline">0 items</badge></div>
      </div>
    </div>
  </div>
</main>
