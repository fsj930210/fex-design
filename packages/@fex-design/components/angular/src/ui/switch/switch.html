@if (checkedContent() !== undefined) {
<span
  switchContent
  state="checked"
  [class]="cn(classNames().content, checkedContentProps()?.class)"
  [style]="mergeStyle(styles().content, checkedContentProps()?.style)"
>
  @if (template(checkedContent()); as contentTemplate) {
  <ng-container *ngTemplateOutlet="contentTemplate" />
  } @else { {{ text(checkedContent()) }} }
</span>
} @if (uncheckedContent() !== undefined) {
<span
  switchContent
  state="unchecked"
  [class]="cn(classNames().content, uncheckedContentProps()?.class)"
  [style]="mergeStyle(styles().content, uncheckedContentProps()?.style)"
>
  @if (template(uncheckedContent()); as contentTemplate) {
  <ng-container *ngTemplateOutlet="contentTemplate" />
  } @else { {{ text(uncheckedContent()) }} }
</span>
}
<span
  switchThumb
  [class]="cn(classNames().thumb, thumbProps()?.class)"
  [style]="mergeStyle(styles().thumb, thumbProps()?.style)"
>
  @if (loading()) {
  <span
    spinner
    [class]="spinnerProps()?.class"
    [style]="spinnerProps()?.style"
    [size]="spinnerProps()?.size ?? 'md'"
    [indicator]="spinnerProps()?.indicator"
    aria-hidden="true"
  ></span>
  }
</span>
