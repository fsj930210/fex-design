@if (loading()) {
<span buttonIcon [placement]="iconPlacement()">
  <ng-content select="[slot=loading-indicator]">
    <fex-loading-icon [class]="spinnerClassName" />
  </ng-content>
</span>
} @else {
<span buttonIcon><ng-content select="[slot=start]" /></span>
}

<ng-content />

@if (!loading()) {
<span buttonIcon placement="end"><ng-content select="[slot=end]" /></span>
}
