<div class="grid w-full gap-space-sm">
  <button button class="w-full" (click)="locate()">Scroll to Item 2.3.3</button>
  <div treeRoot [options]="options">
    <div treeViewport class="h-48 overflow-y-auto">
      <ng-template let-item
        ><div [treeItem]="item.key">
          <button [treeTrigger]="item.key"></button><span treeTitle>{{ item.title }}</span>
        </div></ng-template
      >
    </div>
  </div>
  <output class="min-h-5 text-xs text-muted-foreground" aria-live="polite">{{ message() }}</output>
</div>
