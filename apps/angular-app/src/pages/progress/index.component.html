<div class="flex flex-col gap-6 p-6">
  <div>
    <h1 class="text-2xl font-bold tracking-tight">Progress</h1>
    <p class="text-muted-foreground">
      展示操作的当前进度，或显示任务完成的百分比。
    </p>
  </div>

  <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
    <div card title="Basic" class="p-4">
      <div class="grid gap-4">
        <div progress label="Upload progress" [value]="35" infoPlacement="top"></div>
        <div progress label="Task completion" [value]="70" infoPlacement="top"></div>
      </div>
    </div>

    <div card title="Status" class="p-4">
      <div class="grid gap-4">
        <div progress [value]="0" status="pending"></div>
        <div progress [value]="50" status="active"></div>
        <div progress [value]="70" status="active"></div>
        <div progress [value]="100" status="success"></div>
        <div progress [value]="60" status="error"></div>
      </div>
    </div>

    <div card title="Format & info placement" class="p-4">
      <div class="grid gap-4">
        <div progress label="Storage used" [value]="72" infoPlacement="top"></div>
        <div progress label="Processing" [value]="48" infoPlacement="inside" [showInfo]="true"></div>
        <div progress label="Review" [value]="84" infoPlacement="bottom" [showInfo]="true"></div>
      </div>
    </div>

    <div card title="Color" class="p-4">
      <div class="grid gap-4">
        <div progress [value]="65" color="#7c3aed"></div>
        <div progress [value]="80" color="#059669" trackColor="#cffafe"></div>
        <div progress [value]="90" [color]="gradient"></div>
      </div>
    </div>

    <div card title="Segmented" class="p-4">
      <div class="grid gap-4">
        <div progress [value]="70" [color]="segmentGradient"></div>
        <div class="flex items-center justify-around">
          <div progress variant="circle" [value]="70" [size]="96" [color]="segmentGradient" [showValue]="true"></div>
          <div progress variant="dashboard" [value]="70" [size]="96" [color]="segmentGradient" [showValue]="true"></div>
        </div>
      </div>
    </div>

    <div card title="Step Line" class="p-4">
      <div class="grid gap-4">
        <div progress [value]="50" [steps]="5" color="var(--info)"></div>
        <div progress [value]="80" [steps]="5" color="var(--info)" [success]="true"></div>
        <div progress [value]="100" [steps]="5" color="var(--info)" [success]="true"></div>
      </div>
    </div>

    <div card title="Step Circle" class="p-4">
      <div class="flex items-center justify-around">
        <div progress variant="circle" [value]="50" [steps]="10" [gap]="2" color="var(--info)" [showValue]="true"></div>
        <div progress variant="circle" [value]="80" [steps]="10" [gap]="2" color="var(--info)" [showValue]="true"></div>
        <div progress variant="circle" [value]="100" [steps]="10" [gap]="2" color="var(--info)" [success]="true"></div>
      </div>
    </div>

    <div card title="Size" class="p-4">
      <div class="grid gap-4">
        <div progress [value]="50" [thickness]="4"></div>
        <div progress [value]="50" [thickness]="8"></div>
        <div progress [value]="50" [thickness]="12"></div>
      </div>
    </div>

    <div card title="Linecap" class="p-4">
      <div class="grid gap-4">
        <div progress [value]="50" linecap="round" [thickness]="8"></div>
        <div progress [value]="50" linecap="butt" [thickness]="8"></div>
        <div progress [value]="50" linecap="square" [thickness]="8"></div>
      </div>
    </div>

    <div card title="Circle" class="p-4">
      <div class="flex flex-wrap items-center justify-around gap-4">
        <div progress variant="circle" [value]="75" [size]="96" [thickness]="8" status="active" [showValue]="true"></div>
        <div progress variant="circle" [value]="70" [size]="96" [thickness]="8" status="error" [showValue]="true"></div>
        <div progress variant="circle" [value]="100" [size]="96" [thickness]="8" status="success" [showValue]="true"></div>
      </div>
    </div>

    <div card title="Dashboard" class="p-4">
      <div class="flex items-center justify-around">
        <div progress variant="dashboard" [value]="70" [size]="96" [thickness]="8" [gapDegree]="90" gapPlacement="bottom" [showValue]="true"></div>
        <div progress variant="dashboard" [value]="70" [size]="96" [thickness]="8" [gapDegree]="90" gapPlacement="top" [showValue]="true"></div>
      </div>
    </div>

    <div card title="RTL / LTR" class="p-4">
      <div class="grid gap-4">
        <div dir="ltr"><div progress label="LTR direction" [value]="65" infoPlacement="top"></div></div>
        <div dir="rtl"><div progress label="RTL direction" [value]="65" infoPlacement="top"></div></div>
      </div>
    </div>

    <div card title="Structured composition" class="p-4">
      <div progress label="Upload" [value]="72" status="active" infoPlacement="top" [classNames]="{ root: 'grid gap-2', label: 'font-medium', info: 'text-primary' }"></div>
    </div>

    <div card title="Dynamic & Indeterminate" class="p-4">
      <div class="grid gap-4">
        <div progress [value]="value()"></div>
        <div class="flex items-center gap-2">
          <button button size="sm" variant="outline" (click)="decrease()">
            <minus-icon class="size-4" />
          </button>
          <button button size="sm" variant="outline" (click)="increase()">
            <plus-icon class="size-4" />
          </button>
          <span class="text-sm text-muted-foreground">{{ value() }}%</span>
        </div>
        <div class="flex items-center gap-4">
          <div progress [value]="null"></div>
          <div progress variant="circle" [value]="null" [size]="48" [thickness]="4"></div>
        </div>
      </div>
    </div>
  </div>
</div>
