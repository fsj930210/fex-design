<div class="grid w-full gap-space-sm">
  <div inputRoot [value]="keyword()" (valueChange)="search($event)">
    <input inputControl placeholder="Search tree" aria-label="Search tree" />
  </div>
  <div class="max-h-64 overflow-y-auto">
    <div treeRoot [options]="options()">
      <div treeViewport>
        <ng-template let-item
          ><div [treeItem]="item.key">
            <button [treeTrigger]="item.key"></button
            ><span treeTitle
              ><span
                >{{split(item.data.title, keyword()).before}}@if(split(item.data.title,
                keyword()).match){<mark class="rounded-sm bg-warning/20 px-0.5 text-inherit"
                  >{{split(item.data.title, keyword()).match}}</mark
                >}{{split(item.data.title, keyword()).after}}</span
              ></span
            >
          </div></ng-template
        >
      </div>
    </div>
  </div>
</div>
