<div
  timePickerRoot
  [value]="resolvedValue()"
  [defaultValue]="defaultValue()"
  [open]="open()"
  [format]="format()"
  [use12Hours]="use12Hours()"
  [disabled]="disabled()"
  [readOnly]="readOnly()"
  (change)="handleChange($event)"
  (openChange)="handleOpenChange($event)"
>
  <div timePickerTrigger [placeholder]="placeholder()" [allowClear]="allowClear()"></div>
  <ng-template popoverPortal>
    <div timePickerContent>
      <div timePickerPanel>
        <div timePickerHourColumn></div>
        <div timePickerMinuteColumn></div>
        <div timePickerSecondColumn></div>
        @if (use12Hours()) {
        <div timePickerPeriodColumn></div>
        }
      </div>
    </div>
  </ng-template>
</div>
