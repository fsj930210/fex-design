<div class="flex w-full min-w-0 flex-col gap-4">
  <section class="flex flex-col gap-2">
    <p>小号 sm</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger size="sm"></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
  <section class="flex flex-col gap-2">
    <p>默认 md</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger size="md"></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
  <section class="flex flex-col gap-2">
    <p>大号 lg</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger size="lg"></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
</div>
