<div class="flex w-full flex-wrap items-center justify-center gap-x-6 gap-y-4">
  @for (item of sizes; track item.size) {<button
    button
    [class]="item.className"
    [attr.aria-label]="item.size"
  >
    @if (item.size.startsWith('icon')) {<span buttonIcon><fex-plus-icon /></span>} @else { {{
    item.size }} }</button
  >}
  <button button class="h-12 px-6 text-base">custom</button>
  <button button class="size-12 px-0" aria-label="custom icon size">
    <span buttonIcon><fex-plus-icon /></span>
  </button>
</div>
