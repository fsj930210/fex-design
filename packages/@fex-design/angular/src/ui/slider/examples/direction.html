<div class="grid w-full max-w-xl gap-6">
  <section dir="ltr">
    <p>中文 LTR</p>
    <div slider [defaultValue]="30"></div>
  </section>
  <section dir="rtl">
    <p>العربية RTL</p>
    <div slider [defaultValue]="30" direction="rtl"></div>
  </section>
  <section><p>Reverse</p><div slider [defaultValue]="30" [reverse]="true"></div></section>
  <div class="flex h-48 gap-12">
    <section class="grid gap-2"><p>垂直</p><div slider orientation="vertical" [defaultValue]="35"></div></section>
    <section class="grid gap-2"><p>垂直 Reverse</p><div slider orientation="vertical" [reverse]="true" [defaultValue]="35"></div></section>
  </div>
</div>
