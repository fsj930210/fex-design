<div class="grid grid-cols-3 gap-2 py-3">
  @for (placement of placements; track placement) {
    <div tooltipRoot [placement]="placement">
      <button button tooltipTrigger class="h-16" variant="outlined">{{ placement }}</button
      ><ng-template tooltipPortal
        ><div tooltipContent>
          {{ placement }}
          <div tooltipArrow></div></div
      ></ng-template>
    </div>
  }
</div>
