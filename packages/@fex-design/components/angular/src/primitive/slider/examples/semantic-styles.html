<div class="grid w-full max-w-xl gap-3">
  <div sliderRoot [defaultValue]="[55]" [marks]="[25,75]" class="rounded-lg bg-muted p-6">
    <span sliderTrack class="bg-amber-200"
      ><span sliderRange class="bg-violet-600"></span
      ><span sliderMark [value]="25" class="text-violet-700">低</span
      ><span sliderMark [value]="75" class="text-violet-700">高</span></span
    ><span
      sliderThumb
      [index]="0"
      aria-label="滑块 1"
      class="border-violet-600"
      style="box-shadow: 0 0 0 4px rgb(124 58 237 / 20%)"
    ></span>
  </div>
  <p class="text-sm text-muted-foreground">
    紫色轨道与刻度由 classNames 定制，Thumb 外圈由 styles 定制。
  </p>
</div>
