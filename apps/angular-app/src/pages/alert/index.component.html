<main class="min-h-screen bg-secondary-background px-2 md:px-6 py-4">
  <div class="mx-auto w-full max-w-5xl space-y-4">
    <header class="space-y-2">
      <a class="text-sm text-muted-foreground hover:text-foreground" routerLink="/">Back home</a>
      <h1 class="text-2xl font-semibold text-foreground">Alert</h1>
      <p class="max-w-2xl text-sm leading-6 text-muted-foreground">
        Show status messages with clear semantics.
      </p>
    </header>
    <fex-card title="Primitive" description="Structure with icon, title, description, and action."
      ><div class="grid gap-2">
        @for (variant of variants; track variant) {
          <fex-alert [variant]="variant"
            ><fex-info-icon /><fex-alert-title>{{ variant }}</fex-alert-title
            ><fex-alert-description
              >The current task is in {{ variant }} state. Continue with the page
              action.</fex-alert-description
            ><fex-alert-action
              ><fex-badge variant="outline">New</fex-badge></fex-alert-action
            ></fex-alert
          >
        }
      </div></fex-card
    >
  </div>
</main>
