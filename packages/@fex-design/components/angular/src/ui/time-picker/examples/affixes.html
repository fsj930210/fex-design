<div class="flex w-full min-w-0 flex-col gap-4">
  <section class="grid gap-2">
    <p>默认时钟后缀</p>
    <div timePicker [defaultValue]="{ hour: 9, minute: 30, second: 0 }"></div>
  </section>
  <section class="grid gap-2">
    <p>自定义前缀与后缀</p>
    <div
      timePicker
      prefix="预约"
      suffix="时"
      [defaultValue]="{ hour: 9, minute: 30, second: 0 }"
    ></div>
  </section>
  <section class="grid gap-2">
    <p>自定义时区后缀</p>
    <div
      timePicker
      prefix="时间"
      suffix="UTC"
      [defaultValue]="{ hour: 9, minute: 30, second: 0 }"
    ></div>
  </section>
</div>
