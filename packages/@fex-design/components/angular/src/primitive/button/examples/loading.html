<div class="grid gap-4">
  <div class="grid grid-cols-[7rem_1fr] items-center gap-4">
    <span class="text-sm font-medium">内置加载图标</span>
    <div class="flex flex-wrap items-center gap-3">
      <button button disabled data-loading="true">
        <span buttonIcon><loading-icon [class]="spinnerClassName" /></span>Saving
      </button>
      <button button disabled data-loading="true">
        Publishing<span buttonIcon placement="end"
          ><loading-icon [class]="spinnerClassName"
        /></span>
      </button>
      <button button variant="outlined" disabled data-loading="true">
        <span buttonIcon><loading-icon [class]="spinnerClassName" /></span>Loading
      </button>
    </div>
  </div>
  <div class="grid grid-cols-[7rem_1fr] items-center gap-4">
    <span class="text-sm font-medium">自定义加载图标</span>
    <button button class="w-fit" disabled data-loading="true">
      <span buttonIcon><span class="animate-pulse">•••</span></span
      >Uploading
    </button>
  </div>
</div>
