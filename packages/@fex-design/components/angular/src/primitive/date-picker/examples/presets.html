<div class="flex w-full min-w-0 flex-col gap-4">
  <section class="flex w-full min-w-0 flex-col gap-2">
    <p class="text-sm font-medium">日期</p>
    <div
      datePickerRoot
      [value]="value()"
      [open]="dateOpen()"
      (change)="value.set($event)"
      (openChange)="dateOpen.set($event)"
    >
      <div datePickerTrigger></div>
      <div datePickerContent>
        <div class="flex min-w-0 max-[480px]:flex-col">
          <aside
            class="flex shrink-0 flex-col gap-1 border-e border-border p-2 max-[480px]:flex-row max-[480px]:flex-wrap max-[480px]:border-e-0 max-[480px]:border-b max-[480px]:[&_[data-slot=date-picker-preset]]:w-auto"
            aria-label="预设日期"
          >
            <button datePickerPreset (click)="chooseDate(-1)">昨天</button>
            <button datePickerPreset (click)="chooseDate(7)">下周</button>
          </aside>
          <div class="min-w-0 flex-1">
            <div datePickerPanel></div>
            <div datePickerFooter></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="flex w-full min-w-0 flex-col gap-2">
    <p class="text-sm font-medium">范围</p>
    <div
      rangePickerRoot
      [value]="range()"
      [open]="rangeOpen()"
      (change)="range.set($event)"
      (openChange)="rangeOpen.set($event)"
    >
      <div rangePickerTrigger></div>
      <div rangePickerContent>
        <div class="flex min-w-0 max-[480px]:flex-col">
          <aside
            class="flex shrink-0 flex-col gap-1 border-e border-border p-2 max-[480px]:flex-row max-[480px]:flex-wrap max-[480px]:border-e-0 max-[480px]:border-b max-[480px]:[&_[data-slot=date-picker-preset]]:w-auto"
            aria-label="预设范围"
          >
            <button datePickerPreset (click)="chooseRange('week')">最近 7 天</button>
            <button datePickerPreset (click)="chooseRange('month')">本月</button>
          </aside>
          <div class="min-w-0 flex-1">
            <div rangePickerPanelGroup></div>
            <div datePickerFooter></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
