<div class="flex w-full min-w-0 flex-col gap-4">
  <section class="grid gap-2">
    <p>默认时钟后缀</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
  <section class="grid gap-2">
    <p>自定义前缀与后缀</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger prefix="预约" suffix="时"></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
  <section class="grid gap-2">
    <p>自定义时区后缀</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger prefix="时间" suffix="UTC"></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
</div>
