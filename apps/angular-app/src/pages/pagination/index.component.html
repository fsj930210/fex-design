<main class="min-h-screen bg-secondary-background px-2 md:px-6 py-4">
  <div class="mx-auto w-full max-w-5xl space-y-4">
    <header class="space-y-2">
      <a class="text-sm text-muted-foreground hover:text-foreground" routerLink="/">返回首页</a>
      <h1 class="text-2xl font-semibold text-foreground">Pagination</h1>
      <p class="max-w-2xl text-sm leading-6 text-muted-foreground">
        分页结构只负责可访问语义和基础交互样式。
      </p>
    </header>
    <fex-card title="Primitive" description="上一页、页码、省略号和下一页组合。"
      ><nav fexPagination>
        <ul fexPaginationContent>
          <li fexPaginationItem><a fexPaginationPrevious href="#previous" text="上一页"></a></li>
          <li fexPaginationItem><a fexPaginationLink href="#1">1</a></li>
          <li fexPaginationItem><a fexPaginationLink href="#2" [isActive]="true">2</a></li>
          <li fexPaginationItem><span fexPaginationEllipsis></span></li>
          <li fexPaginationItem><a fexPaginationNext href="#next" text="下一页"></a></li>
        </ul></nav
    ></fex-card>
  </div>
</main>
