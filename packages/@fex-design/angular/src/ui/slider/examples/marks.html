<div class="grid w-full max-w-2xl gap-8 pb-6">
  <button type="button" (click)="moveRecommended()">将建议刻度移到 {{ recommended() === 37 ? 60 : 37 }}°C</button>
  <section class="grid gap-6"><h4>included=true</h4><div class="grid gap-3"><p>单值</p><div slider [defaultValue]="37" [marks]="marks()"></div></div><div class="grid gap-3"><p>范围</p><div slider [defaultValue]="[26, 37]" [marks]="marks()"></div></div></section>
  <section class="grid gap-4"><h4>included=false（刻度彼此独立）</h4><div slider [defaultValue]="37" [marks]="marks()" [included]="false"></div></section>
  <section class="grid gap-4"><h4>marks &amp; step（步长与刻度并存）</h4><div slider [defaultValue]="37" [marks]="marks()" [dots]="true" [step]="10"></div></section>
  <section class="grid gap-4"><h4>step=null（只能落在标记点）</h4><div slider [defaultValue]="37" [marks]="marks()" [step]="null"></div></section>
</div>
