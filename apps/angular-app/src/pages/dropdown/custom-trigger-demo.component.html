<fex-dropdown
  ><button
    fexDropdownTrigger
    class="grid size-10 place-items-center rounded-full bg-primary text-primary-foreground"
    aria-label="Open account menu"
  >
    FX</button
  ><ng-template popoverPortal
    ><fex-dropdown-content
      ><fex-menu-root
        ><fex-menu-list class="space-y-0.5"
          ><button fexMenuItem [class]="itemClassName">Profile</button
          ><button fexMenuItem [class]="itemClassName">Preferences</button
          ><button fexMenuItem [class]="itemClassName">Sign out</button></fex-menu-list
        ></fex-menu-root
      ></fex-dropdown-content
    ></ng-template></fex-dropdown
>
