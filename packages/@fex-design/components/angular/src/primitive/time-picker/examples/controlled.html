<div class="flex w-full min-w-0 flex-col gap-6">
  <div class="flex flex-wrap gap-2">
    <button button (click)="value.set(afternoonValue)">设置 14:45:30</button>
    <button button (click)="value.set(initialValue)">恢复初始时间</button>
    <button button (click)="value.set(null)">清空外部值</button>
    <button button (click)="open.set(true)">打开受控面板</button>
    <button button (click)="open.set(false)">关闭受控面板</button>
  </div>
  <section class="flex w-full min-w-0 flex-col gap-2">
    <p class="text-sm font-medium">受控：value / open</p>
    <p class="text-sm text-muted-foreground">外部按钮设置、清空时间，并控制面板开关。</p>
    <div timePickerRoot [value]="value()" [open]="open()" (change)="value.set($event.value)" (openChange)="open.set($event)">
      <div timePickerTrigger></div>
      <ng-template popoverPortal><div timePickerContent><div timePickerPanel>
        <div timePickerHourColumn></div><div timePickerMinuteColumn></div><div timePickerSecondColumn></div>
      </div></div></ng-template>
    </div>
    <output class="text-sm text-muted-foreground">外部值：{{ formatValue(value()) }}；面板：{{ open() ? '打开' : '关闭' }}</output>
  </section>
  <section class="flex w-full min-w-0 flex-col gap-2">
    <p class="text-sm font-medium">非受控：defaultValue</p>
    <p class="text-sm text-muted-foreground">defaultValue 仅初始化读取；上方外部值变化不会覆盖这里的选择。</p>
    <div timePickerRoot [defaultValue]="value()" (change)="uncontrolledValue.set($event.value)">
      <div timePickerTrigger></div>
      <ng-template popoverPortal><div timePickerContent><div timePickerPanel>
        <div timePickerHourColumn></div><div timePickerMinuteColumn></div><div timePickerSecondColumn></div>
      </div></div></ng-template>
    </div>
    <output class="text-sm text-muted-foreground">选择结果：{{ formatValue(uncontrolledValue()) }}</output>
  </section>
</div>
