<div class="grid gap-6 sm:grid-cols-2">
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">rounded</span>
    <div class="flex flex-wrap items-center gap-3">
      <button
        switch
        shape="rounded"
        defaultChecked
        checkedContent="开启"
        uncheckedContent="关闭"
        style="
          --switch-track-background: #dbeafe;
          --switch-track-checked-background: #7c3aed;
          --switch-track-border-color: #60a5fa;
          --switch-track-checked-border-color: #6d28d9;
          --switch-color: #1e3a8a;
          --switch-checked-color: #fff;
          --switch-thumb-background: #fef3c7;
          --switch-thumb-color: #7c3aed;
        "
        aria-label="rounded CSS Variables"
      ></button>
    </div>
  </section>
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">pill</span>
    <div class="flex flex-wrap items-center gap-3">
      <button
        switch
        shape="pill"
        defaultChecked
        checkedContent="开启"
        uncheckedContent="关闭"
        style="
          --switch-track-background: #dbeafe;
          --switch-track-checked-background: #7c3aed;
          --switch-track-border-color: #60a5fa;
          --switch-track-checked-border-color: #6d28d9;
          --switch-color: #1e3a8a;
          --switch-checked-color: #fff;
          --switch-thumb-background: #fef3c7;
          --switch-thumb-color: #7c3aed;
        "
        aria-label="pill CSS Variables"
      ></button>
    </div>
  </section>
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">加载图标</span
    ><button
      switch
      [loading]="true"
      [defaultChecked]="true"
      class="[--switch-track-checked-background:#7c3aed] [--switch-thumb-background:#f5f3ff] [--primary:#6d28d9]"
      [spinnerProps]="{class:'text-primary'}"
      aria-label="加载图标"
    ></button>
  </section>
</div>
