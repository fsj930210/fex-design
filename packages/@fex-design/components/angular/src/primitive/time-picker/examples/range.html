<div class="grid w-full gap-6">
  <section class="grid gap-2">
    <p>默认确认后提交</p>
    <div timeRangePickerRoot [defaultValue]="initial" (change)="confirmed.set($event.value)">
      <div timeRangePickerTrigger></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div>
          <div timeRangePickerFooter></div></div
      ></ng-template>
    </div>
    <output aria-live="polite">已提交：{{ display(confirmed()) }}</output>
  </section>
  <section class="grid gap-2">
    <p>关闭确认，完整有效区间即时提交</p>
    <div
      timeRangePickerRoot
      [defaultValue]="initial"
      [needConfirm]="false"
      (change)="immediate.set($event.value)"
    >
      <div timeRangePickerTrigger></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div>
          <div timeRangePickerFooter></div></div
      ></ng-template>
    </div>
    <output aria-live="polite">已提交：{{ display(immediate()) }}</output>
  </section>
</div>
