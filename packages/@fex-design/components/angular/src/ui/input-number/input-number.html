<span inputPrefix [class]="prefixClassName()" [style]="styles()?.prefix">
    <ng-content select="[inputNumberPrefix]" />
  </span>
  <input
    inputNumberControl
    [id]="id()"
    [name]="name()"
    [placeholder]="placeholder()"
    [required]="required()"
    [attr.aria-invalid]="invalid() || null"
    [attr.aria-describedby]="describedBy() || null"
    [class]="classNames()?.control"
    [style]="styles()?.control"
  />
  @if (clearable()) {
  <button inputNumberClear [class]="classNames()?.clear" [style]="styles()?.clear"></button>
  }
  <span inputSuffix [class]="suffixClassName()" [style]="styles()?.suffix">
    <ng-content select="[inputNumberSuffix]" />
  </span>
  @if (controls()) {
  <span inputNumberActions [class]="classNames()?.actions" [style]="styles()?.actions">
    <button
      inputNumberIncrement
      [class]="classNames()?.increment"
      [style]="styles()?.increment"
    ></button>
    <button
      inputNumberDecrement
      [class]="classNames()?.decrement"
      [style]="styles()?.decrement"
    ></button>
  </span>
  }
