<div class="grid w-full gap-4">
  <section class="grid gap-2">
    <p>classNames</p>
    <div
      timePicker
      [defaultValue]="{ hour: 9, minute: 30, second: 0 }"
      [classNames]="classNames"
    ></div>
  </section>
  <section class="grid gap-2">
    <p>styles</p>
    <div timePicker [defaultValue]="{ hour: 9, minute: 30, second: 0 }" [styles]="styles"></div>
  </section>
</div>
