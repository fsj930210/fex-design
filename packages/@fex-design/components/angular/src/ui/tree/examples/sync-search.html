<div class="grid w-full gap-space-sm">
  <div
    input
    [value]="keyword()"
    (valueChange)="search($event)"
    placeholder="Search tree"
    aria-label="Search tree"
  ></div>
  <div class="max-h-64 overflow-y-auto">
    <div
      tree
      [treeData]="treeProps().treeData"
      [expandedKeys]="expandedKeys()"
      (expand)="expandedKeys.set($event.keys)"
    >
      <ng-template let-item let-tree="tree"
        >@if(!item.isLeaf){<button
          type="button"
          [class]="triggerClass"
          [attr.aria-expanded]="expandedKeys().includes(item.key)"
          [attr.aria-label]="'展开或收起 ' + item.data.title"
          (click)="$event.stopPropagation(); toggle(tree, item.key)"
        >
          <svg chevronDownIcon class="size-4"></svg></button
        >}@else{<span class="size-5 shrink-0"></span>}<span [class]="titleClass"
          >{{split(item.data.title, keyword()).before}}@if(split(item.data.title,
          keyword()).match){<mark class="rounded-sm bg-warning/20 px-0.5 text-inherit"
            >{{split(item.data.title, keyword()).match}}</mark
          >}{{split(item.data.title, keyword()).after}}</span
        ></ng-template
      >
    </div>
  </div>
</div>
