<main class="min-h-screen bg-secondary-background px-2 md:px-6 py-4">
  <div class="mx-auto w-full max-w-5xl space-y-4">
    <header class="space-y-4">
      <a class="text-sm text-muted-foreground hover:text-foreground" routerLink="/">Back home</a>
      <div>
        <h1 class="text-2xl font-semibold text-foreground">Switch</h1>
        <p class="mt-2 max-w-2xl text-sm leading-6 text-muted-foreground">
          Boolean toggle UI with controlled and uncontrolled usage.
        </p>
      </div>
    </header>
    <div class="space-y-4">
      <fex-card title="Basic" description="Uncontrolled switch uses defaultChecked."
        ><button switch defaultChecked aria-label="Enable notifications">
          <span switchThumb></span></button
      ></fex-card>
      <fex-card title="Controlled" description="Controlled switch uses checked and checkedChange."
        ><div class="grid gap-2">
          <button
            switch
            [checked]="checked()"
            (checkedChange)="checked.set($event.checked)"
            aria-label="Controlled switch"
          >
            <span switchThumb></span>
          </button>
          <p class="text-sm text-muted-foreground">Current value: {{ checked() }}</p>
        </div></fex-card
      >
      <fex-card title="Sizes" description="Switch supports sm, default, and lg sizes."
        ><div class="flex items-center gap-2">
          <button switch size="sm" defaultChecked aria-label="Small switch">
            <span switchThumb size="sm"></span></button
          ><button switch defaultChecked aria-label="Default switch">
            <span switchThumb></span></button
          ><button switch size="lg" defaultChecked aria-label="Large switch">
            <span switchThumb size="lg"></span>
          </button></div
      ></fex-card>
      <fex-card title="Disabled" description="Disabled state blocks interaction."
        ><div class="flex items-center gap-2">
          <button switch disabled aria-label="Disabled switch">
            <span switchThumb></span></button
          ><button switch disabled defaultChecked aria-label="Disabled checked switch">
            <span switchThumb></span>
          </button></div
      ></fex-card>
    </div>
  </div>
</main>
