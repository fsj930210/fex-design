<div class="flex w-full min-w-0 flex-col gap-4">
  <section class="flex flex-col gap-2">
    <p>outlined</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger variant="outlined"></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
  <section class="flex flex-col gap-2">
    <p>filled</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger variant="filled"></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
  <section class="flex flex-col gap-2">
    <p>borderless</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger variant="borderless"></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
  <section class="flex flex-col gap-2">
    <p>underlined</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger variant="underlined"></div>
      <ng-template popoverPortal
        ><div timePickerContent>
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
</div>
