<avatar-group [class]="classNames().root" [style]="styles().root"><ng-content /> @if (split().overflowCount > 0) { @if (overflow(); as template) { <ng-container *ngTemplateOutlet="template; context: { $implicit: split().overflowCount, items: split().overflowItems }" /> } @else { <avatar-group-count [class]="classNames().overflow" [style]="styles().overflow">+{{ split().overflowCount }}</avatar-group-count> } }</avatar-group>
