<div
  calendarRoot
  #calendarElement
  monthSelection="drilldown"
  [locale]="calendarAppearance().locale"
  [style]="calendarAppearance().style ?? ''"
  [value]="null"
  [range]="context().displayRange"
  [viewDate]="panelViewDate() ?? context().viewDate"
  [panel]="context().panel"
  [granularity]="getGranularityByPicker(context().picker)"
  [weekStartsOn]="context().weekStartsOn"
  [min]="context().minDate"
  [max]="context().maxDate"
  [disabledDate]="disabledDate"
  (select)="state.select($event.value)"
  (cellSelect)="state.previewCell($event)"
  (cellHover)="state.setHoverValue($event.value)"
  (mouseleave)="leave($event)"
  (viewDateChange)="state.setViewDate($event)"
  (panelChange)="state.setPanel($event)"
  [class]="panelClassName()"
>
  @if (template(); as custom) {
  <ng-container
    [ngTemplateOutlet]="custom"
    [ngTemplateOutletInjector]="calendarInjector() ?? null"
    [ngTemplateOutletContext]="{ $implicit: context(), state: context(), calendar: calendar() }"
  />
  } @else {
  <div datePickerPanelContent [calendarProps]="calendarAppearance()"></div>
  }
</div>
