<main class="min-h-screen bg-secondary-background px-2 md:px-6 py-4">
  <div class="mx-auto w-full max-w-5xl space-y-4">
    <header class="space-y-2">
      <a class="text-sm text-muted-foreground hover:text-foreground" routerLink="/">Back home</a>
      <h1 class="text-2xl font-semibold text-foreground">Badge</h1>
      <p class="max-w-2xl text-sm leading-6 text-muted-foreground">
        Use badges for compact status, category, and count labels.
      </p>
    </header>
    <div class="grid gap-4">
      <fex-card title="Variants" description="Badge visual styles."
        ><div class="flex min-w-0 flex-wrap items-center gap-2">
          @for (color of colors; track color) {
            <badge [color]="color">{{ color }}</badge>
          }
        </div></fex-card
      ><fex-card title="Group" description="使用 maxCount 收起过多的标签。"
        ><badge-group [maxCount]="3">
          @for (item of overflowItems; track item) {
            <badge color="info">{{ item }}</badge>
          }
        </badge-group></fex-card
      >
    </div>
  </div>
</main>
