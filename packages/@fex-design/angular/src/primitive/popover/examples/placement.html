<div class="w-full flex items-center justify-center min-h-[600px] py-16">
<div class="grid w-full gap-4">
  
  
  <div class="grid grid-cols-[repeat(5,5rem)] grid-rows-[repeat(5,2.25rem)] justify-center gap-3 px-8 py-28 [&_button]:h-9 [&_button]:w-20 [&_button]:justify-center [&_button]:px-2">
    @for (item of cases; track item.label) {
      <div [style.grid-area]="item.cell">
        <div popoverRoot #panel="popover"
        [open]="options(item).open"
        [trigger]="options(item).trigger"
        [placement]="options(item).placement" [avoidCollisions]="false"
        [arrow]="options(item).arrow"
        [arrowPadding]="options(item).arrowPadding"
        [align]="options(item).align"
        [side]="options(item).side"
        [sideOffset]="options(item).sideOffset"
        [alignOffset]="options(item).alignOffset"
        [getPopupContainer]="options(item).getPopupContainer"
        [lazyMount]="options(item).lazyMount"
        [destroyOnHidden]="options(item).destroyOnHidden">
        <button button popoverTrigger>{{ item.label }}</button>
        <ng-template popoverPortal>
          <div popoverContent>
            <div popoverArrow></div>
            <div popoverHeader><div popoverTitle>提示信息</div></div>
            <p>这里可以放置说明和交互内容。</p>
          </div>
        </ng-template>
      </div>
      </div>
    }
    
  </div>
</div>

</div>
