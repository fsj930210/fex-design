<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- 深邃质感背景渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <!-- 字母精致高光白渐变 -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
    <!-- x 字母的微亮点缀 -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- 黑色圆角矩形背景与微弱外边框 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#27272a" stroke-width="3" />

  <!-- 内部精致微高光边缘 -->
  <rect x="7" y="7" width="114" height="114" rx="25" fill="none" stroke="#3f3f46" stroke-width="1" stroke-opacity="0.4" />

  <!-- 核心字母 fex 设计 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="-2px">
    <text x="21" y="80" fill="url(#textGrad)">fe</text>
    <!-- x 字母带渐变亮点，体现设计科技感 -->
    <text x="68" y="80" fill="url(#accentGrad)">x</text>
  </g>

  <!-- 右下角现代设计组件原语装饰微点 -->
  <circle cx="101" cy="40" r="3.5" fill="#38bdf8" />
</svg>