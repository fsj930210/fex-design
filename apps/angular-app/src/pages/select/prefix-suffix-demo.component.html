<div
  card
  title="Prefix and suffix"
  description="prefix decorates the input; suffix replaces the chevron."
>
  <div class="max-w-md space-y-2">
    <div selectRoot [items]="options"
      ><div selectTrigger placeholder="带前缀"
        ><ng-template #prefix><info-icon class="size-4" /></ng-template></div
      ><div selectContent></div></div
    ><div selectRoot [items]="options"
      ><div selectTrigger placeholder="自定义后缀"
        ><ng-template #suffix><fex-check-icon /></ng-template></div
      ><div selectContent></div
    ></div>
  </div>
</div>
