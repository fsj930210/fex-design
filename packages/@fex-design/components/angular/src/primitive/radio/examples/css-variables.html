<div class="grid gap-3">
  <div radioGroup defaultValue="custom">
    <div class="inline-grid min-w-0 grid-cols-[auto_1fr] items-center gap-2 align-middle">
      <button
        radio
        id="radio-css-custom"
        value="custom"
        class="[--radio-size:1.5rem] [--radio-checked-color:var(--success)]"
      ></button
      ><label for="radio-css-custom" class="min-w-0 cursor-pointer select-none text-sm"
        >自定义</label
      >
    </div>
  </div>
  <div radioGroup defaultValue="button" class="gap-0">
    <button radioButton value="button" class="[--radio-button-checked-background:var(--success)]">
      自定义按钮
    </button>
  </div>
</div>
