<ng-template #customCell let-cell="cell">
  @if (cell.panel === 'date' && cell.date.day === 15) {
  <span
    class="pointer-events-none absolute bottom-0.5 left-1/2 size-1 -translate-x-1/2 rounded-full bg-primary"
  ></span>
  }
</ng-template>
<div class="flex w-full min-w-0 flex-col gap-4">
  <section class="flex w-full min-w-0 flex-col gap-2">
    <p class="text-sm font-medium">每月 15 日</p>
    <div
      datePickerRoot
      [defaultValue]="date"
      [calendarProps]="{ cellRender: customCell, classNames: { cellContent: 'pointer-events-none' } }"
    >
      <div datePickerTrigger></div>
      <div datePickerContent>
        <div datePickerPanel></div>
        <div datePickerFooter></div>
      </div>
    </div>
    <div
      rangePickerRoot
      [defaultValue]="{ start: date, end: date.add({ days: 7 }) }"
      [calendarProps]="{ cellRender: customCell, classNames: { cellContent: 'pointer-events-none' } }"
    >
      <div rangePickerTrigger></div>
      <div rangePickerContent>
        <div rangePickerPanelGroup></div>
        <div datePickerFooter></div>
      </div>
    </div>
  </section>
</div>
