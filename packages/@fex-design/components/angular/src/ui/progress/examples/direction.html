<div class="grid w-full max-w-md gap-5">
  <div dir="ltr">
    <div progress [value]="65" label="LTR" infoPlacement="top"></div>
  </div>
  <div dir="rtl">
    <div progress [value]="65" label="RTL" infoPlacement="top"></div>
  </div>
  <div class="flex items-start gap-6">
    <div class="grid justify-items-center gap-1 text-sm" dir="ltr">
      <div progress variant="circle" [value]="65" [size]="96" [showInfo]="true"></div>
      <span>
        LTR（顺时针）
      </span>
    </div>
    <div class="grid justify-items-center gap-1 text-sm" dir="rtl">
      <div
        progress
        variant="circle"
        [value]="65"
        [size]="96"
        [showInfo]="true"
        [classNames]="{'track':'scale-x-[-1]'}"
      ></div>
      <span>
        RTL（反向）
      </span>
    </div>
  </div>
</div>
