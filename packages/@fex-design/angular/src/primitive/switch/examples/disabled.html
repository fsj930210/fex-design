<div class="grid gap-6 sm:grid-cols-2">
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">rounded</span>
    <div class="flex flex-wrap items-center gap-3">
      <button switch shape="rounded" disabled aria-label="rounded 禁用关闭">
        <span switchThumb></span></button
      ><button switch shape="rounded" disabled defaultChecked aria-label="rounded 禁用开启">
        <span switchThumb></span>
      </button>
    </div>
  </section>
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">pill</span>
    <div class="flex flex-wrap items-center gap-3">
      <button switch shape="pill" disabled aria-label="pill 禁用关闭">
        <span switchThumb></span></button
      ><button switch shape="pill" disabled defaultChecked aria-label="pill 禁用开启">
        <span switchThumb></span>
      </button>
    </div>
  </section>
</div>
