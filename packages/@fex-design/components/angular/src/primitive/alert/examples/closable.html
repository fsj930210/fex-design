<div class="grid w-full gap-3">
  @if (visible()) {
  <div alert type="warning">
    <span alertIcon><triangle-alert-icon /></span>
    <div alertTitle>这条提示可以关闭</div>
    <button
      [class]="alertCloseClassName"
      data-slot="alert-close"
      aria-label="关闭提示"
      (click)="visible.set(false)"
    >
      <x-icon class="size-3.5" />
    </button>
  </div>
  } @else { <button (click)="visible.set(true)">重新显示</button> }
  <div alert>
    <div alertTitle>阻止默认关闭</div>
    <div alertDescription>关闭事件被阻止后保持显示。</div>
    <button
      [class]="alertCloseClassName"
      data-slot="alert-close"
      aria-label="关闭提示"
      (click)="$event.preventDefault()"
    >
      <x-icon class="size-3.5" />
    </button>
  </div>
</div>
