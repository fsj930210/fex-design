<ng-template #content>
  @if (triggerTemplate(); as custom) {
  <div
    datePickerTrigger
    #trigger="datePickerTrigger"
    [class]="hostClassName()"
    [attr.style]="hostStyle()"
    [placeholder]="placeholder()"
    [prefix]="prefix() ?? prefixTemplate()"
    [suffix]="suffix() ?? suffixTemplate()"
    [size]="size()"
    [variant]="variant()"
  >
    <ng-template let-state="state" let-trigger="trigger" let-ref="ref"
      ><ng-container
        [ngTemplateOutlet]="custom"
        [ngTemplateOutletInjector]="triggerInjector() ?? injector"
        [ngTemplateOutletContext]="{ $implicit: state, state: state, trigger: trigger, ref: ref }"
    /></ng-template>
  </div>
  } @else {
  <div
    datePickerTrigger
    #trigger="datePickerTrigger"
    [class]="hostClassName()"
    [attr.style]="hostStyle()"
    [placeholder]="placeholder()"
    [prefix]="prefix() ?? prefixTemplate()"
    [suffix]="suffix() ?? suffixTemplate()"
    [size]="size()"
    [variant]="variant()"
  ></div>
  }
  <div datePickerContent>
    @if (panelTemplate(); as custom) {
    <ng-container
      [ngTemplateOutlet]="custom"
      [ngTemplateOutletInjector]="injector"
      [ngTemplateOutletContext]="{ $implicit: context(), state: context(), panel: defaultPanel }"
    />
    } @else { <ng-container [ngTemplateOutlet]="defaultPanel" /> }
    <ng-template #defaultPanel><div datePickerPanel></div></ng-template>
    @if (footerKind() !== 'hidden') {
    <div datePickerFooter [content]="footerContent()"></div>
    }
  </div>
</ng-template>
@if (containerTemplate(); as container) {
<ng-container
  [ngTemplateOutlet]="container"
  [ngTemplateOutletInjector]="injector"
  [ngTemplateOutletContext]="{ $implicit: context(), state: context(), content: content }"
/>
} @else { <ng-container [ngTemplateOutlet]="content" /> }
