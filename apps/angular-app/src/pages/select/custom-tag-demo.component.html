<div card title="Custom selected tags" description="The tag template controls each selected value.">
  <div class="max-w-md">
    <fex-select [multiple]="true" [options]="options" [defaultValue]="values"
      ><fex-select-trigger placeholder="请选择"
        ><ng-template #tag let-item let-remove="remove"
          ><span tag size="sm" [color]="color(item.value)" (pointerdown)="$event.preventDefault()"
            >{{ item.label
            }}<button
              tagAction
              aria-label="移除标签"
              (click)="$event.stopPropagation(); remove()"
            ></button></span></ng-template></fex-select-trigger
      ><fex-select-content><fex-select-list /></fex-select-content
    ></fex-select>
  </div>
</div>
