<button button (click)="show()">打开最小化与最大化</button>
<div dialog [open]="open" (openChange)="setOpen($event)" [modal]="false">
  <div dialogPortal>
    <div dialogContent [class]="windowClass" [style]="style">
      <div dialogHeader>
        <h2 dialogTitle>
          <div
            #handle
            move
            [moveTarget]="panel(handle)"
            [position]="position"
            [applyStyle]="false"
            bounds="viewport"
            [disabled]="mode === 'maximized'"
            (move)="move($event)"
            (dblclick)="mode = 'normal'"
            class="cursor-move touch-none select-none pe-20 font-semibold leading-6"
          >
            最小化与最大化@if (mode === 'minimized') {
            <button
              type="button"
              aria-label="预览窗口，点击恢复"
              class="absolute bottom-full start-0 z-20 hidden pb-2 group-hover/minimax:block"
              (pointerdown)="$event.stopPropagation()"
              (click)="mode = 'normal'"
            >
              <span
                class="block w-60 overflow-hidden rounded-md border border-border bg-background text-left text-foreground shadow-xl"
                ><span class="block h-[150px] w-[480px] origin-top-left scale-50"
                  ><span class="block border-b border-border p-4 font-semibold">最小化与最大化</span
                  ><span class="block h-[180px] p-4 text-sm leading-6"
                    >最小化后工具条仍可拖动，双击工具条或点击恢复按钮还原窗口，保留原位置和尺寸。</span
                  ><span class="block border-t border-border p-4 text-right"
                    ><span class="inline-block rounded-md border border-border px-3 py-1 text-sm"
                      >关闭窗口</span
                    ></span
                  ></span
                ></span
              >
            </button>
            }
          </div>
        </h2>
      </div>
      <div dialogActions>
        @if (mode !== 'minimized') {
        <button
          button
          variant="text"
          [class]="actionClassName"
          aria-label="最小化"
          (click)="minimize()"
        >
          <svg minusIcon class="size-4"></svg></button
        ><button
          button
          variant="text"
          [class]="actionClassName"
          [attr.aria-label]="mode === 'normal' ? '最大化' : '恢复'"
          (click)="mode = mode === 'normal' ? 'maximized' : 'normal'"
        >
          <svg squareIcon class="size-4"></svg></button
        ><button dialogClose iconOnly></button> }
      </div>
      <div dialogBody [class]="mode === 'minimized' ? 'hidden' : 'flex-1 min-h-0'">
        <p>最小化后工具条仍可拖动，双击工具条或点击恢复按钮还原窗口，保留原位置和尺寸。</p>
      </div>
      <div dialogFooter [class]="mode === 'minimized' ? 'hidden' : ''">
        <button button (click)="open = false">关闭窗口</button>
      </div>
    </div>
  </div>
</div>
