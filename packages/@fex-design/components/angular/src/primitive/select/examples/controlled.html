<div class="flex flex-wrap gap-4"><div class="space-y-2"><div class="flex flex-wrap gap-2"><button class="cursor-pointer rounded-md border border-border bg-background px-3 py-1.5 text-sm hover:bg-muted" type="button" (click)="value.set('react')">设置 React</button><button class="cursor-pointer rounded-md border border-border bg-background px-3 py-1.5 text-sm hover:bg-muted" type="button" (click)="value.set('vue')">设置 Vue</button><button class="cursor-pointer rounded-md border border-border bg-background px-3 py-1.5 text-sm hover:bg-muted" type="button" (click)="open.set(true)">打开面板</button><button class="cursor-pointer rounded-md border border-border bg-background px-3 py-1.5 text-sm hover:bg-muted" type="button" (click)="open.set(false)">关闭面板</button></div><p class="text-sm text-muted-foreground">当前受控值：{{ value() }}；面板：{{ open() ? '打开' : '关闭' }}</p><div selectRoot [options]="options" [value]="value()" (change)="value.set($event.value?.toString() ?? '')" [open]="open()" (openChange)="open.set($event)"><div selectTrigger class="w-60"></div><div selectContent></div></div></div><div class="space-y-2"><span>非受控 value / open</span><div selectRoot [options]="options" [defaultValue]="'vue'" [defaultOpen]="true"><div selectTrigger class="w-60"></div><div selectContent></div></div></div></div>
