<div class="grid gap-6 sm:grid-cols-2">
  <section dir="ltr" class="grid gap-2">
    <span class="text-sm text-muted-foreground">LTR</span>
    <div class="flex flex-wrap items-center gap-3">
      <button
        switch
        shape="rounded"
        defaultChecked
        checkedContent="开启"
        uncheckedContent="关闭"
        aria-label="rounded 文字开关"
      ></button
      ><button
        switch
        shape="pill"
        defaultChecked
        checkedContent="开启"
        uncheckedContent="关闭"
        aria-label="pill 文字开关"
      ></button>
    </div>
  </section>
  <section dir="rtl" class="grid gap-2">
    <span class="text-sm text-muted-foreground">RTL</span>
    <div class="flex flex-wrap items-center gap-3">
      <button
        switch
        shape="rounded"
        defaultChecked
        checkedContent="开启"
        uncheckedContent="关闭"
        aria-label="rounded 文字开关"
      ></button
      ><button
        switch
        shape="pill"
        defaultChecked
        checkedContent="开启"
        uncheckedContent="关闭"
        aria-label="pill 文字开关"
      ></button>
    </div>
  </section>
</div>
