<div class="grid w-full gap-3">
  <div input [value]="value()" (valueChange)="value.set($event)" clearable></div>
  <div input defaultValue="非受控内容" clearable></div>
  <div class="flex gap-2">
    <button button (click)="value.set('外部设置')">外部设置</button
    ><button button (click)="value.set('')">外部清空</button>
  </div>
</div>
