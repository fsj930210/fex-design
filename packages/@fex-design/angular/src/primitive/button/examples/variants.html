<div class="grid gap-3">
  @for (color of colors; track color.value) {
  <div class="grid grid-cols-[8.5rem_minmax(0,1fr)] items-center gap-4">
    <span class="whitespace-nowrap text-sm font-medium"
      >{{ color.value }}（{{ color.label }}）</span
    >
    <div class="flex flex-wrap items-center gap-3">
      @for (variant of variants; track variant) {
      <button button [variant]="variant" [color]="color.value">{{ variant }}</button>
      }
    </div>
  </div>
  }
  <div class="grid grid-cols-[8.5rem_minmax(0,1fr)] items-center gap-4">
    <span class="whitespace-nowrap text-sm font-medium">custom（自定义）</span>
    <div class="flex flex-wrap items-center gap-3">
      @for (variant of variants; track variant) {<button
        button
        [variant]="variant"
        [style]="customColor"
      >
        {{ variant }}</button
      >}
    </div>
  </div>
  <div class="grid grid-cols-[8.5rem_minmax(0,1fr)] items-center gap-4">
    <span class="whitespace-nowrap text-sm font-medium">gradient（渐变）</span
    ><button
      button
      class="w-fit border-transparent bg-linear-to-r from-violet-600 to-cyan-500 text-white hover:brightness-110"
    >
      Gradient
    </button>
  </div>
</div>
