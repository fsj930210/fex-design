<ng-template #loadingIndicator>
  <span
    buttonIcon
    [placement]="iconPlacement()"
    [class]="iconProps()?.class"
    [style]="iconProps()?.style"
  >
    <ng-content select="[slot=loading-indicator]">
      <svg
        loadingIcon
        [class]="cn(spinnerClassName, loadingIconProps()?.class)"
        [style]="loadingIconProps()?.style"
      ></svg>
    </ng-content>
  </span>
</ng-template>

@if (loading()) { @if (iconPlacement() === 'start') {
<ng-container [ngTemplateOutlet]="loadingIndicator" />
} } @else {
<span buttonIcon [class]="startIconProps()?.class" [style]="startIconProps()?.style"
  ><ng-content select="[slot=start]"
/></span>
}

<ng-content />

@if (loading()) { @if (iconPlacement() === 'end') {
<ng-container [ngTemplateOutlet]="loadingIndicator" />
} } @else {
<span buttonIcon placement="end" [class]="endIconProps()?.class" [style]="endIconProps()?.style"
  ><ng-content select="[slot=end]"
/></span>
}
