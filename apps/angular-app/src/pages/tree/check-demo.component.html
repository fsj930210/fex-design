<fex-card
  title="Check modes"
  description="Cascade links parent and children; strict keeps every node independent."
  ><div class="grid gap-3 lg:grid-cols-2">
    <div class="space-y-1.5">
      <p class="text-sm font-medium">Cascade</p>
      <fex-demo-tree
        [options]="cascadeOptions()"
        [checkable]="true"
        class="block rounded-md border border-border bg-background p-1.5"
      />
    </div>
    <div class="space-y-1.5">
      <p class="text-sm font-medium">Strict</p>
      <fex-demo-tree
        [options]="strictOptions()"
        [checkable]="true"
        class="block rounded-md border border-border bg-background p-1.5"
      />
    </div></div
></fex-card>
