<div class="grid min-h-80 w-full max-w-xl content-start gap-3">
  <div class="flex gap-2">
    <button button size="sm" (click)="show(false)">默认主题</button>
    <button button size="sm" (click)="show(true)">紫色主题</button>
  </div>
  <div
    menu
    layout="inline"
    [defaultValue]="['overview']"
    [openValues]="open()"
    (openValuesChange)="open.set($event)"
    class="w-full max-w-xs rounded-xl border border-border p-2"
    [style]="theme()"
  >
    <button menuItem value="overview">概览</button>
    <div subMenu value="workspace">
      <button subMenuTrigger>工作空间</button>
      <div subMenuContent [content]="workspaceContent"></div>
      <ng-template #workspaceContent>
        <button menuItem value="members">成员</button>
        <button menuItem value="roles">角色</button>
        <button menuItem value="billing" [disabled]="true">账单</button>
      </ng-template>
    </div>
    <div menuSeparator></div>
    <div menuGroup label="账户">
      <button menuItem value="profile">个人资料</button>
      <button menuItem value="logout">退出登录</button>
    </div>
  </div>
</div>
