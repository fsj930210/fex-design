<div
  card
  title="Custom option rendering"
  description="The option template replaces content while behavior remains intact."
>
  <div class="max-w-md">
    <div selectRoot [options]="options"
      ><div selectTrigger placeholder="请选择技术" ></div><div selectContent
        ><div selectList
          ><ng-template #option let-item
            ><div class="flex items-center justify-between gap-3">
              <span>{{ item.label }}</span
              ><span class="text-xs text-muted-foreground">{{ item.group }}</span>
            </div></ng-template
          ></div
        ></div
      ></div
    >
  </div>
</div>
