<div class="grid w-full max-w-md gap-4">
  <div progressRoot [value]="45" class="inline-flex items-center gap-2">
    <div progressTrack class="w-full bg-[#cffafe]">
      <div progressRange class="bg-[#7c3aed]"></div>
    </div>
    <span progressValue>
      45%
    </span>
  </div>
  <div progressRoot [value]="75" class="inline-flex items-center gap-2">
    <div progressTrack>
      <div progressRange class="bg-[linear-gradient(to_right,_#1677ff_0%,_#87d068_100%)]"></div>
    </div>
    <span progressValue>
      75%
    </span>
  </div>
  <div class="flex gap-4">
    <div progressRoot [value]="60" variant="circle" [size]="96" class="relative">
      <svg progressCircle>
        <circle progressCircleTrack />
        <circle progressCircleRange class="text-[#7c3aed]" />
      </svg>
      <div class="absolute inset-0 flex items-center justify-center">
        <span progressValue class="text-sm">
          60%
        </span>
      </div>
    </div>
  </div>
</div>
