<div class="grid gap-6 sm:grid-cols-2">
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">rounded</span>
    <div class="flex flex-wrap items-center gap-3">
      <button
        switch
        shape="rounded"
        defaultChecked
        checkedContent="开启"
        uncheckedContent="关闭"
        [classNames]="classNames"
        [styles]="styles"
        aria-label="rounded 结构化样式"
      ></button>
    </div>
  </section>
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">pill</span>
    <div class="flex flex-wrap items-center gap-3">
      <button
        switch
        shape="pill"
        defaultChecked
        checkedContent="开启"
        uncheckedContent="关闭"
        [classNames]="classNames"
        [styles]="styles"
        aria-label="pill 结构化样式"
      ></button>
    </div>
  </section>
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">加载图标</span
    ><button
      switch
      [loading]="true"
      [defaultChecked]="true"
      class="[--switch-track-checked-background:#0f766e] [--switch-thumb-background:#ccfbf1]"
      [spinnerProps]="{class:'text-violet-600'}"
      aria-label="加载图标"
    ></button>
  </section>
</div>
