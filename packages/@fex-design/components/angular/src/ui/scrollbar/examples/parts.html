<div class="flex w-full flex-wrap gap-6">
  <section class="grid gap-3"><h4 class="text-sm font-medium">显式组合 Bar、Track、Thumb、Corner</h4>
    <p class="max-w-72 text-sm text-muted-foreground">浅色长槽是 Track，深色滑块是 Thumb，右下方交角是 Corner；Bar 是外层定位容器。</p>
    <div scrollbarRoot showTrack class="h-48 w-72 rounded-md border" [autoHide]="'never'" [overflow]="{'x':'auto','y':'auto'}"><div scrollbarViewport><div class="grid w-[40rem] gap-3 p-4">@for (line of lines; track line) {<p>{{ line }}</p>}</div></div>
      <div scrollbarBar [axis]="'x'"><div scrollbarTrack [axis]="'x'"><div scrollbarThumb [axis]="'x'"></div></div></div>
      <div scrollbarBar [axis]="'y'"><div scrollbarTrack [axis]="'y'"><div scrollbarThumb [axis]="'y'"></div></div></div>
      <div scrollbarCorner></div></div>
  </section>
</div>
