<div class="grid w-full gap-4">
  <section class="grid gap-2">
    <p>classNames</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div
        timePickerTrigger
        [class]="classNames.root"
        [inputProps]="{ class: classNames.input }"
      ></div>
      <ng-template timePickerPortal
        ><div timePickerContent [class]="classNames.popup">
          <div timePickerPanel [class]="classNames.panel">
            <div
              timePickerHourColumn
              [class]="classNames.column"
              [itemClass]="classNames.item"
              [selectedItemClass]="classNames.selectedItem"
            ></div>
            <div
              timePickerMinuteColumn
              [class]="classNames.column"
              [itemClass]="classNames.item"
              [selectedItemClass]="classNames.selectedItem"
            ></div>
            <div
              timePickerSecondColumn
              [class]="classNames.column"
              [itemClass]="classNames.item"
              [selectedItemClass]="classNames.selectedItem"
            ></div>
          </div></div
      ></ng-template>
    </div>
  </section>
  <section class="grid gap-2">
    <p>styles</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger [style]="styles.root" [inputProps]="{ style: styles.input }"></div>
      <ng-template timePickerPortal
        ><div timePickerContent [style]="styles.popup">
          <div timePickerPanel [style]="styles.panel">
            <div
              timePickerHourColumn
              [style]="styles.column"
              [itemStyle]="styles.item"
              [selectedItemStyle]="styles.selectedItem"
            ></div>
            <div
              timePickerMinuteColumn
              [style]="styles.column"
              [itemStyle]="styles.item"
              [selectedItemStyle]="styles.selectedItem"
            ></div>
            <div
              timePickerSecondColumn
              [style]="styles.column"
              [itemStyle]="styles.item"
              [selectedItemStyle]="styles.selectedItem"
            ></div>
          </div></div
      ></ng-template>
    </div>
  </section>
</div>
