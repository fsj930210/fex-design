<fex-cascader-simple-demo
  title="Controlled"
  description="External actions and Cascader share one path value."
  [options]="options"
  [value]="value"
  (valueChange)="value = $event"
/>
<div class="mt-2 flex gap-2">
  <button button (click)="value = ['jiangsu', 'suzhou', 'industrial-park', 'loufeng']">
    Set Suzhou</button
  ><button button variant="outline" (click)="value = undefined">Clear</button>
</div>
<code>{{ value | json }}</code>
