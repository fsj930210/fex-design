@if (header()) {
<ng-container *ngTemplateOutlet="header() ?? null" />
} @else if (title() || description() || extra()) {
<div cardHeader [className]="classNames().header" [style]="styles().header">
  @if (title()) {
  <div cardTitle [className]="classNames().title" [style]="styles().title">{{ title() }}</div>
  } @if (description()) {
  <div cardDescription [className]="classNames().description" [style]="styles().description">
    {{ description() }}
  </div>
  } @if (extra()) {
  <div cardExtra [className]="classNames().extra" [style]="styles().extra">
    <ng-container *ngTemplateOutlet="extra() ?? null" />
  </div>
  }
</div>
}
<div cardContent [className]="classNames().content" [style]="styles().content">
  <ng-content />
</div>
@if (footer()) {
<div cardFooter [className]="classNames().footer" [style]="styles().footer">
  <ng-container *ngTemplateOutlet="footer() ?? null" />
</div>
}
