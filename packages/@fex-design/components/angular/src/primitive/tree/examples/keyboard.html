<section class="grid w-full gap-space-sm">
  <p class="text-sm text-muted-foreground">
    逐次按 Tab 进入树，Shift+Tab 返回；进入后用 ↑/↓、Home/End 移动节点焦点，←/→ 收起或展开，Enter
    选择，Space 勾选。再次按 Tab 离开树；鼠标悬停不会切换键盘焦点。
  </p>
  <div class="h-64 overflow-y-auto">
    <div treeRoot [options]="options">
      <div treeViewport>
        <ng-template let-item
          ><div [treeItem]="item.key">
            <button [treeTrigger]="item.key"></button>
            <div treeCheckbox></div>
            <span treeTitle>{{item.data.title}}</span>
          </div></ng-template
        >
      </div>
    </div>
  </div>
  <output class="break-all text-xs" aria-live="polite"
    >焦点：{{focused() ?? '无'}}；选择：{{selected().join(', ') || '无'}}；勾选：{{checked().join(',
    ') || '无'}}</output
  >
</section>
