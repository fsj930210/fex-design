<div class="grid w-full max-w-2xl gap-10">
  <section class="grid gap-4">
    <h4>整体禁用</h4>
    <div slider [defaultValue]="40" [disabled]="true"></div>
  </section>
  <section class="grid gap-4">
    <h4>禁用指定 Thumb</h4>
    <div class="flex flex-wrap gap-4">
      @for (checked of disabledThumbs(); track $index) {
      <div checkbox [checked]="checked" (change)="toggle($index)">Thumb {{ $index + 1 }}</div>
      }
    </div>
    <div slider [defaultValue]="[20, 50, 80]" [disabled]="disabledThumbs()"></div>
  </section>
</div>
