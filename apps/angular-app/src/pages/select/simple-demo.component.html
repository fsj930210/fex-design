<div card [title]="title" [description]="description">
  <div class="max-w-md">
    <div selectRoot
      [items]="items"
      [multiple]="multiple"
      [clearable]="clearable"
      [showSearch]="showSearch"
      [defaultValue]="defaultValue"
      [filterOption]="filterOption"
      [maxCount]="maxCount"
      [virtual]="virtual"
      ><div selectTrigger
        [placeholder]="placeholder"
        [maxTagCount]="maxTagCount" ></div><div selectContent></div
    ></div>
  </div>
</div>
