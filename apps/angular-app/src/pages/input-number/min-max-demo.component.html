<div
  card
  title="Min and max"
  description="Actions are disabled when the value reaches its boundary."
>
  <div class="grid gap-3 md:grid-cols-2">
    <label class="grid gap-1.5 text-sm text-foreground">
      Minimum: 0
      <div inputNumber [defaultValue]="0" [min]="0" [max]="10" aria-label="Value at minimum"></div>
    </label>
    <label class="grid gap-1.5 text-sm text-foreground">
      Maximum: 10
      <div inputNumber [defaultValue]="10" [min]="0" [max]="10" aria-label="Value at maximum"></div>
    </label>
  </div>
</div>
