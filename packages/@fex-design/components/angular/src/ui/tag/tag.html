<ng-content />
@if (closable()) { @if (projectedCloseIcon()) {
<button
  tagAction
  [aria-label]="actionProps()?.['aria-label'] ?? 'Close'"
  [disabled]="disabled()"
  [class]="closeClassName()"
  [style]="mergeStyle(styles().close, actionProps()?.style)"
  (click)="close.emit($event)"
>
  <ng-content select="[tagCloseIcon]" />
</button>
} @else {
<button
  tagAction
  [aria-label]="actionProps()?.['aria-label'] ?? 'Close'"
  [disabled]="disabled()"
  [class]="closeClassName()"
  [style]="mergeStyle(styles().close, actionProps()?.style)"
  (click)="close.emit($event)"
></button>
} }
