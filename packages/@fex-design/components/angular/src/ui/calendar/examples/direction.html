<div class="grid gap-6">

    <strong class="mb-3 block">LTR · English</strong>
    <div calendar [defaultViewDate]="date" [locale]="locale"></div>

  <section dir="rtl" class="min-w-0 rounded-lg border p-3">

  </section>
</div>
