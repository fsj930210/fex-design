<div class="grid w-full gap-space-xl sm:grid-cols-2">
  @for (dir of directions; track dir) {
  <ng-template #extra
    ><button class="rounded-md border px-3 py-1.5 text-sm">
      {{ dir === 'ltr' ? '操作' : 'إجراء' }}
    </button></ng-template
  >
  <ng-template #footer
    ><button class="rounded-md bg-primary px-3 py-1.5 text-primary-foreground">
      {{ dir === 'ltr' ? '保存' : 'حفظ' }}
    </button></ng-template
  >
  <div
    card
    class="w-full"
    [attr.dir]="dir"
    [title]="dir === 'ltr' ? 'LTR · 中文示例' : 'RTL · مثال عربي'"
    [description]="dir === 'ltr' ? '标题与操作按逻辑方向排列。' : 'يُرتَّب العنوان والإجراء حسب الاتجاه المنطقي.'"
    [extra]="extra"
    [footer]="footer"
  >
    {{ dir === 'ltr' ? '内容区域保持中文阅读顺序。' : 'يحافظ المحتوى على ترتيب القراءة العربية.' }}
  </div>
  }
</div>
