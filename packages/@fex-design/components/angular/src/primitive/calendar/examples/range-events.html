<div
  calendarRoot
  [defaultViewDate]="options.defaultViewDate"
  [locale]="options.locale"
  [weekStartsOn]="options.weekStartsOn ?? 0"
  [showWeek]="options.showWeek"
  [fullscreen]="options.fullscreen"
  [class]="rootClass"
  [attr.data-fullscreen]="true"
>
  <div
    calendarExampleContent
    [options]="options"
    [cellTemplate]="cell"
    [classNames]="{ cell: 'px-0', cellContent: 'overflow-visible' }"
  >
    <ng-template #cell let-cell="cell"
      >@if (event(cell); as item) {
      <div class="bg-primary text-primary-foreground px-2" [attr.data-segment]="item.segment">
        {{ item.label }}
      </div>
      }</ng-template
    >
  </div>
</div>
