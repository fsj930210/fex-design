<div calendar [defaultViewDate]="date">
  <ng-template #header let-state="state" let-controller="controller"
    ><div class="flex w-full items-center justify-between">
      <button type="button" (click)="controller.navigate('previous-panel')">上一页</button
      ><strong>{{ state.viewDate.year }} / {{ state.viewDate.month }}</strong
      ><button type="button" (click)="controller.navigate('next-panel')">下一页</button>
    </div></ng-template
  >
</div>
