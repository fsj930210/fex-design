<div class="flex w-full min-w-0 flex-col gap-4">
  <section class="flex flex-col gap-2">
    <p>outlined</p>
    <div timePicker variant="outlined" [defaultValue]="{ hour: 9, minute: 30, second: 0 }"></div>
  </section>
  <section class="flex flex-col gap-2">
    <p>filled</p>
    <div timePicker variant="filled" [defaultValue]="{ hour: 9, minute: 30, second: 0 }"></div>
  </section>
  <section class="flex flex-col gap-2">
    <p>borderless</p>
    <div timePicker variant="borderless" [defaultValue]="{ hour: 9, minute: 30, second: 0 }"></div>
  </section>
  <section class="flex flex-col gap-2">
    <p>underlined</p>
    <div timePicker variant="underlined" [defaultValue]="{ hour: 9, minute: 30, second: 0 }"></div>
  </section>
</div>
