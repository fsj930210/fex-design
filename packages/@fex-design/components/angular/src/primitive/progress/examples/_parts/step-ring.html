<div progressRoot [value]="value()" variant="circle" [size]="96" [thickness]="4" class="relative">
  <svg progressCircle>
    @for (step of geometry().steps; track step.index) {
      <circle
        [attr.cx]="48"
        [attr.cy]="48"
        [attr.r]="geometry().radius"
        fill="none"
        [attr.stroke]="step.active ? ringColor() : 'var(--progress-remaining)'"
        [attr.stroke-width]="4"
        [attr.stroke-dasharray]="geometry().stepDasharray"
        [attr.stroke-dashoffset]="step.offset"
        stroke-linecap="butt"
        [attr.pathLength]="geometry().circumference"
      />
    }
  </svg>
  <div class="absolute inset-0 flex items-center justify-center">
    @if (value() === 100) {
      <check-icon class="size-5 text-success" />
    } @else {
      <span progressValue class="text-sm">
        {{ value() }}%
      </span>
    }
  </div>
</div>
