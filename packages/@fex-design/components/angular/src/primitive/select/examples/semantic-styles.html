<div class="grid w-full gap-4">
  <div selectRoot [options]="options" defaultValue="react">
    <div
      selectTrigger
      class="w-72 max-w-full border-violet-300 bg-white text-violet-800 rounded-md"
      [inputProps]="inputProps"
      placeholder="请选择框架"
    ></div>
    <div
      selectContent
      class="border-violet-300 bg-white text-violet-800 [--primary:#6d28d9] [--muted-background:#f5f3ff]"
    ></div>
  </div>
  <div selectRoot [options]="options" [multiple]="true" [defaultValue]="['react','vue']">
    <div
      selectTrigger
      class="w-72 max-w-full border-violet-300 bg-white text-violet-800 rounded-md"
      [inputProps]="inputProps"
      [valueProps]="valueProps"
      [maxTagCount]="1"
    ></div>
    <div
      selectContent
      class="border-violet-300 bg-white text-violet-800 [--primary:#6d28d9] [--muted-background:#f5f3ff]"
    ></div>
  </div>
</div>
