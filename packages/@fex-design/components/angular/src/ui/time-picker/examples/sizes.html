<div class="flex w-full min-w-0 flex-col gap-4">
  <section class="flex flex-col gap-2">
    <p>小号 sm</p>
    <div timePicker size="sm" [defaultValue]="{ hour: 9, minute: 30, second: 0 }"></div>
  </section>
  <section class="flex flex-col gap-2">
    <p>默认 md</p>
    <div timePicker size="md" [defaultValue]="{ hour: 9, minute: 30, second: 0 }"></div>
  </section>
  <section class="flex flex-col gap-2">
    <p>大号 lg</p>
    <div timePicker size="lg" [defaultValue]="{ hour: 9, minute: 30, second: 0 }"></div>
  </section>
</div>
