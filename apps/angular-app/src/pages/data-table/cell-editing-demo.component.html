<div
  card
  title="Cell editing"
  description="Editing belongs to application data, not a hidden table copy. Click a value, then press Enter or blur to commit; Escape cancels the current cell."
>
  <section class="space-y-1.5">
    <h3 class="text-sm font-medium text-foreground">Editable name, status and visits</h3>
    <fex-data-table [table]="table">
      <ng-template fexDataTableCell let-cell>
        @if (editing()?.rowId === cell.row.id && editing()?.field === cell.column.id) {
          <div inputRoot [value]="value(cell)">
            <input inputControl autofocus (blur)="commit(cell, $event)" />
          </div>
        } @else {
          <button
            button
            variant="text"
            class="h-auto w-full justify-start px-0 text-inherit"
            (click)="edit(cell)"
          >
            {{ value(cell) }}
          </button>
        }
      </ng-template>
    </fex-data-table>
  </section>
</div>
