<div class="flex w-full min-w-0 flex-col gap-4">
  <section class="flex flex-col gap-2">
    <p>默认</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div timePickerTrigger></div>
      <ng-template popoverPortal
        ><div
          timePickerContent
          class="[--border:#c4b5fd] [--elevated-background:#ffffff] [--elevated-foreground:#6d28d9] [--primary:#6d28d9] [--muted-background:#f5f3ff]"
        >
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
  <section class="flex flex-col gap-2">
    <p>紫色边框、聚焦光环与浅色背景</p>
    <div timePickerRoot [defaultValue]="{ hour: 9, minute: 30, second: 0 }">
      <div
        timePickerTrigger
        class="[--input-border-color:var(--color-purple-500)] [--focus-border:var(--color-purple-600)] [--input-ring-color:var(--color-purple-200)] [--input-background:var(--color-purple-50)] [--input-color:var(--color-purple-950)]"
      ></div>
      <ng-template popoverPortal
        ><div
          timePickerContent
          class="[--border:#c4b5fd] [--elevated-background:#ffffff] [--elevated-foreground:#6d28d9] [--primary:#6d28d9] [--muted-background:#f5f3ff]"
        >
          <div timePickerPanel>
            <div timePickerHourColumn></div>
            <div timePickerMinuteColumn></div>
            <div timePickerSecondColumn></div>
          </div></div
      ></ng-template>
    </div>
  </section>
</div>
