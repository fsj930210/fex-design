<div class="grid w-full max-w-md gap-4">
  <div class="flex items-center gap-6">
    <div progressRoot [value]="value()" class="flex min-w-0 flex-1 flex-col">
      <div class="flex w-full items-center">
        <div progressTrack class="min-w-0 flex-1">
          <div progressRange></div>
        </div>
        <span progressValue class="ms-2 shrink-0 text-sm">
          {{ value() }}%
        </span>
      </div>
    </div>
    <div progressRoot [value]="value()" variant="circle" [size]="96" class="relative">
      <svg progressCircle>
        <circle progressCircleTrack />
        <circle progressCircleRange />
      </svg>
      <div class="absolute inset-0 flex items-center justify-center">
        <span progressValue>
          {{ value() }}%
        </span>
      </div>
    </div>
  </div>
  <div class="flex gap-2">
    <button type="button" class="rounded border px-3 py-1 text-sm hover:bg-muted" (click)="decrease()">
      -10%
    </button>
    <button type="button" class="rounded border px-3 py-1 text-sm hover:bg-muted" (click)="increase()">
      +10%
    </button>
  </div>
</div>
