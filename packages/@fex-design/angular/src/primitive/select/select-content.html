<ng-template popoverPortal
  ><div
    popoverContent
    [class]="contentClass"
    [style.width]="'var(--floating-reference-width)'"
    [style.max-width]="'var(--floating-available-width)'"
    [style.max-height]="'var(--floating-available-height, calc(100vh - 16px))'"
    [style.overflow]="'hidden'"
    [style.padding]="'0px'"
  >
    <ng-content><div selectList></div></ng-content></div
></ng-template>
