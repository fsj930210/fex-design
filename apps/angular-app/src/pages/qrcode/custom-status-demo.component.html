<fex-card title="自定义状态渲染器" description="调用方完全控制遮罩内容、按钮和状态切换逻辑。">
  <div class="flex flex-wrap items-center gap-2">
    <fex-qrcode-root value="https://fex.design/qrcode/custom-status" [size]="176">
      <svg fexQrCodeSvg>
        <rect fexQrCodeBackground />
        <path fexQrCodeModules />
      </svg>
      @if (expired()) {
        <fex-qrcode-overlay>
          <div class="grid gap-1">
            <span class="text-sm font-medium">二维码已过期</span>
            <button button size="sm" (click)="expired.set(false)">重新加载</button>
          </div>
        </fex-qrcode-overlay>
      }
    </fex-qrcode-root>
    <button button variant="outline" (click)="expired.update((value) => !value)">切换状态</button>
  </div>
</fex-card>
