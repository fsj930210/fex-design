<div class="grid w-full max-w-md gap-3">
  <div progressRoot [value]="0" status="pending" class="flex w-full flex-col">
    <div class="flex w-full items-center">
      <div progressTrack class="min-w-0 flex-1">
        <div progressRange></div>
      </div>
      <span progressValue class="ms-2 shrink-0 text-sm font-medium">
        0%
      </span>
    </div>
  </div>
  <div progressRoot [value]="40" status="active" class="flex w-full flex-col">
    <div class="flex w-full items-center">
      <div progressTrack class="min-w-0 flex-1">
        <div progressRange></div>
      </div>
      <span progressValue class="ms-2 shrink-0 text-sm font-medium">
        40%
      </span>
    </div>
  </div>
  <div progressRoot [value]="60" status="active" class="flex w-full flex-col">
    <div class="flex w-full items-center">
      <div progressTrack class="min-w-0 flex-1">
        <div progressRange></div>
      </div>
      <span progressValue class="ms-2 shrink-0 text-sm font-medium">
        60%
      </span>
    </div>
  </div>
  <div progressRoot [value]="100" status="success" class="flex w-full flex-col">
    <div class="flex w-full items-center">
      <div progressTrack class="min-w-0 flex-1">
        <div progressRange></div>
      </div>
      <span progressValue class="ms-2 shrink-0 text-sm font-medium">
        <span class="inline-flex size-4 items-center justify-center rounded-full bg-success text-[10px] text-white">
          <check-icon class="size-3" />
        </span>
      </span>
    </div>
  </div>
  <div progressRoot [value]="80" status="error" class="flex w-full flex-col">
    <div class="flex w-full items-center">
      <div progressTrack class="min-w-0 flex-1">
        <div progressRange></div>
      </div>
      <span progressValue class="ms-2 shrink-0 text-sm font-medium">
        80%
      </span>
    </div>
  </div>
</div>
