<div class="grid gap-6 sm:grid-cols-2">
  <section class="grid justify-items-start gap-2">
    <span class="text-sm text-muted-foreground">rounded</span>
    <div class="flex flex-wrap items-center gap-3">
      <div class="grid justify-items-start gap-2">
        <span class="text-xs">非受控</span
        ><button switch shape="rounded" aria-label="rounded 非受控"></button
        ><span class="mt-2 text-xs">受控</span
        ><button
          switch
          shape="rounded"
          [checked]="roundedChecked()"
          (change)="roundedChecked.set($event.checked)"
          aria-label="rounded 受控"
        ></button>
        <div class="flex gap-2">
          <button button size="sm" (click)="roundedChecked.set(true)">开启</button
          ><button button size="sm" (click)="roundedChecked.set(false)">关闭</button>
        </div>
      </div>
    </div>
  </section>
  <section class="grid justify-items-start gap-2">
    <span class="text-sm text-muted-foreground">pill</span>
    <div class="flex flex-wrap items-center gap-3">
      <div class="grid justify-items-start gap-2">
        <span class="text-xs">非受控</span
        ><button switch shape="pill" aria-label="pill 非受控"></button
        ><span class="mt-2 text-xs">受控</span
        ><button
          switch
          shape="pill"
          [checked]="pillChecked()"
          (change)="pillChecked.set($event.checked)"
          aria-label="pill 受控"
        ></button>
        <div class="flex gap-2">
          <button button size="sm" (click)="pillChecked.set(true)">开启</button
          ><button button size="sm" (click)="pillChecked.set(false)">关闭</button>
        </div>
      </div>
    </div>
  </section>
</div>
