<div class="grid w-full max-w-md gap-5">
  <div dir="ltr">
    <div progressRoot [value]="65" class="flex w-full flex-col">
      <div class="mb-1.5 flex w-full items-center justify-between text-sm">
        <span progressLabel>
          LTR
        </span>
        <span progressValue>
          65%
        </span>
      </div>
      <div progressTrack>
        <div progressRange></div>
      </div>
    </div>
  </div>
  <div dir="rtl">
    <div progressRoot [value]="65" class="flex w-full flex-col">
      <div class="mb-1.5 flex w-full items-center justify-between text-sm">
        <span progressLabel>
          RTL
        </span>
        <span progressValue>
          65%
        </span>
      </div>
      <div progressTrack>
        <div progressRange></div>
      </div>
    </div>
  </div>
  <div class="flex items-start gap-6">
    <div class="grid justify-items-center gap-1 text-sm" dir="ltr">
      <div progressRoot [value]="65" variant="circle" [size]="96" class="relative">
        <svg progressCircle>
          <circle progressCircleTrack />
          <circle progressCircleRange />
        </svg>
        <div class="absolute inset-0 flex items-center justify-center">
          <span progressValue>
            65%
          </span>
        </div>
      </div>
      <span>
        LTR（顺时针）
      </span>
    </div>
    <div class="grid justify-items-center gap-1 text-sm" dir="rtl">
      <div progressRoot [value]="65" variant="circle" [size]="96" class="relative">
        <svg progressCircle [style.transform]="'scaleX(-1)'">
          <circle progressCircleTrack />
          <circle progressCircleRange />
        </svg>
        <div class="absolute inset-0 flex items-center justify-center">
          <span progressValue>
            65%
          </span>
        </div>
      </div>
      <span>
        RTL（反向）
      </span>
    </div>
  </div>
</div>
