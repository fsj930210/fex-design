<div class="grid gap-6 sm:grid-cols-2">
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">rounded</span>
    <div class="flex flex-wrap items-center gap-3">
      <button switch shape="rounded" aria-label="rounded 关闭"></button
      ><button switch shape="rounded" defaultChecked aria-label="rounded 开启"></button>
    </div>
  </section>
  <section class="grid gap-2">
    <span class="text-sm text-muted-foreground">pill</span>
    <div class="flex flex-wrap items-center gap-3">
      <button switch shape="pill" aria-label="pill 关闭"></button
      ><button switch shape="pill" defaultChecked aria-label="pill 开启"></button>
    </div>
  </section>
</div>
