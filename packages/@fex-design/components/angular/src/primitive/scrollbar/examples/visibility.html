<div class="flex w-full flex-wrap gap-6">
  <section class="grid gap-3"><h4 class="text-sm font-medium">auto：内容溢出时显示</h4>
    <div scrollbarRoot class="h-48 w-72 rounded-md border" [autoHide]="'never'" [overflow]="{'x':'hidden','y':'auto'}" [visibility]="'auto'"><div scrollbarViewport><div class="grid gap-3 p-4">@for (line of lines; track line) {<p>{{ line }}</p>}</div></div>
      <div scrollbarBar [axis]="'y'"><div scrollbarTrack [axis]="'y'"><div scrollbarThumb [axis]="'y'"></div></div></div></div>
  </section>
  <section class="grid gap-3"><h4 class="text-sm font-medium">always：内容不足时也显示</h4>
    <div scrollbarRoot class="h-48 w-72 rounded-md border" [autoHide]="'never'" [overflow]="{'x':'hidden','y':'auto'}" [visibility]="'always'"><div scrollbarViewport><p class="p-4">内容不足一屏</p></div>
      <div scrollbarBar [axis]="'y'"><div scrollbarTrack [axis]="'y'"><div scrollbarThumb [axis]="'y'"></div></div></div></div>
  </section>
  <section class="grid gap-3"><h4 class="text-sm font-medium">hidden：隐藏滚动条，保留原生滚动</h4>
    <div scrollbarRoot class="h-48 w-72 rounded-md border" [autoHide]="'never'" [overflow]="{'x':'hidden','y':'auto'}" [visibility]="'hidden'"><div scrollbarViewport><div class="grid gap-3 p-4">@for (line of lines; track line) {<p>{{ line }}</p>}</div></div>
      <div scrollbarBar [axis]="'y'"><div scrollbarTrack [axis]="'y'"><div scrollbarThumb [axis]="'y'"></div></div></div></div>
  </section>
</div>
