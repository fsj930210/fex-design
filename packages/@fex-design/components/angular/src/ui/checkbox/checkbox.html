<div
  checkboxRoot
  [value]="value()"
  [checked]="checked() ?? formValue()"
  [defaultChecked]="defaultChecked()"
  [disabled]="disabled()"
  [aria-invalid]="ariaInvalid()"
>
  <input
    type="checkbox"
    checkboxControl
    [value]="value()"
    [checked]="checked() ?? formValue()"
    [defaultChecked]="defaultChecked()"
    [disabled]="disabled()"
    [indeterminate]="indeterminate()"
    [name]="name()"
    [attr.aria-invalid]="ariaInvalid() || null"
    (change)="handleChange($event)"
  />
  <span checkboxIndicator></span>
  <label checkboxLabel><ng-content /></label>
</div>
