<div card title="Tooltip" description="Compose Tooltip to reveal delivery metadata.">
  <div class="mx-auto grid w-full max-w-2xl gap-4 py-8">
    <fex-bubble
      ><fex-bubble-content
        >Did you remove the stale route and regenerate the registry?</fex-bubble-content
      ></fex-bubble
    >
    <div tooltipRoot>
      <button tooltipTrigger>
        <fex-bubble side="end" variant="solid"
          ><fex-bubble-content
            >Yes. The route is gone and the registry is clean.</fex-bubble-content
          ></fex-bubble
        ></button
      ><ng-template tooltipPortal
        ><div tooltipContent>
          Read at 10:24 · Delivered to 3 devices
          <div tooltipArrow></div></div
      ></ng-template>
    </div>
    <fex-bubble variant="plain"
      ><fex-bubble-content class="text-muted-foreground"
        >Hover or focus the reply to inspect its delivery metadata.</fex-bubble-content
      ></fex-bubble
    >
  </div>
</div>
