<fex-color-picker-root
  [value]="controlled() ? value() : undefined"
  defaultValue="#1677FF"
  [disabled]="disabled()"
  (change)="change($event)"
>
  @if (inline()) {
    <fex-color-picker-panel-demo [alpha]="alpha()" [clear]="clear()" [oklch]="oklch()" />
  } @else {
    <div popoverRoot [trigger]="hover() ? ['hover'] : ['click']"
      ><button
        popoverTrigger
        [disabled]="disabled()"
        [attr.data-disabled]="disabled() || null"
        class="inline-flex h-9 w-fit max-w-full self-start items-center gap-2 rounded-md border border-border bg-background px-2 data-disabled:cursor-not-allowed data-disabled:bg-muted-background data-disabled:opacity-50"
      >
        <span fexColorPickerSwatch></span>
        @if (text()) {
          <span class="text-sm">Color</span>
        }</button
      ><ng-template popoverPortal><div popoverContent
        ><fex-color-picker-panel-demo
          [alpha]="alpha()"
          [clear]="clear()"
          [oklch]="oklch()" /></div></ng-template></div>
  }
</fex-color-picker-root>
@if (controlled()) {
  <code class="mt-2 block text-xs text-muted-foreground">{{ value() }}</code>
}
