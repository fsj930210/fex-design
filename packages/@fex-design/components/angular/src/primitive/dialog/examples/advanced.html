<button button (click)="open=true">打开高级 Dialog</button><div dialog [open]="open" (openChange)="open=$event[0]"><div dialogPortal><div dialogOverlay></div><div dialogContent [style]="contentStyle()" [class]="maximized ? 'max-w-none w-screen h-screen' : 'max-w-none w-[520px] min-w-80 max-w-[860px] min-h-55 max-h-[620px] resize'"><div dialogHeader><div class="cursor-move select-none" (pointerdown)="dragStart($event)" (pointermove)="dragMove($event)" (pointerup)="dragEnd()"><h2 dialogTitle>高级交互</h2></div><button button (click)="minimized=!minimized">{{ minimized ? '恢复' : '最小化' }}</button><button button (click)="maximized=!maximized">{{ maximized ? '还原' : '最大化' }}</button><button dialogClose iconOnly></button></div><div dialogBody>拖动 Header 移动窗口，使用边缘调整尺寸，最小/最大状态共享同一个 Dialog。</div></div></div></div>
