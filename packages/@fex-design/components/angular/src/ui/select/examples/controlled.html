<div class="flex flex-wrap gap-4"><div class="space-y-2"><div class="flex flex-wrap gap-2"><button class="cursor-pointer rounded-md border border-border bg-background px-3 py-1.5 text-sm hover:bg-muted" type="button" (click)="value.set('react')">设置 React</button><button class="cursor-pointer rounded-md border border-border bg-background px-3 py-1.5 text-sm hover:bg-muted" type="button" (click)="value.set('vue')">设置 Vue</button><button class="cursor-pointer rounded-md border border-border bg-background px-3 py-1.5 text-sm hover:bg-muted" type="button" (click)="open.set(true)">打开面板</button><button class="cursor-pointer rounded-md border border-border bg-background px-3 py-1.5 text-sm hover:bg-muted" type="button" (click)="open.set(false)">关闭面板</button></div><p class="text-sm text-muted-foreground">当前受控值：{{ value() }}；面板：{{ open() ? '打开' : '关闭' }}</p><div select class="w-60" [options]="options" [value]="value()" (change)="value.set($event.value?.toString() ?? '')" [popoverProps]="{ open: open(), onOpenChange: setOpen }"></div></div><div class="space-y-2"><span>非受控 value / open</span><div select class="w-60" [options]="options" [defaultValue]="'vue'" [popoverProps]="{ defaultOpen: true }"></div></div></div>
